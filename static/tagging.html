<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tag card | Rizzy</title>
<style>:root{font:16px/1.5 system-ui,sans-serif;background:#1b1b1b;color:#f5f0e8}*{box-sizing:border-box}body{margin:0}main{max-width:560px;margin:36px auto;padding:24px;border:1px solid #46433d;border-radius:14px;background:#292826}a{color:#e7bd61}strong{font-size:22px}input{width:100%;margin:16px 0;padding:10px;border:1px solid #666158;border-radius:8px;background:#34322f;color:#fff}ul{list-style:none;padding:0}li{margin:4px 0}button{display:flex;width:100%;justify-content:space-between;padding:10px;border:0;border-radius:7px;background:transparent;color:#f5f0e8;text-align:left;font:inherit;cursor:pointer}button:hover,.popup__item[aria-selected=true] button{background:#46433d}.card__tags{display:flex;gap:10px;align-items:center}.card-tags__list{display:flex;gap:8px}.card__tag-picker-button,.tag-dialog{display:none}.popup__item[hidden]{display:none}.error{color:#ff9f96}</style></head>
<body><main><p><a href="/{{ACCOUNT}}/cards/{{NUMBER}}">← Back to card</a></p>{{TAGS}}{{PICKER}}<p class="error" role="alert" id="tag-error"></p></main>
<script>{{TAG_PICKER_SCRIPT}}</script>
<script>
const main=document.querySelector('main');
main.addEventListener('input',event=>{if(event.target.id==='tag-search')scheduleTagPickerFilter(event.target.closest('.tag-picker'))});
main.addEventListener('keydown',navigateTagPicker);
main.addEventListener('submit',async event=>{const form=event.target;if(!form.closest('turbo-frame'))return;event.preventDefault();if(form.id.startsWith('tags_form_card_')&&!form.elements.tag_title.value.trim())return;const button=event.submitter;if(button)button.disabled=true;document.getElementById('tag-error').textContent='';try{const body=new URLSearchParams(new FormData(form));const response=await fetch(form.action,{method:'POST',headers:{Accept:'text/vnd.turbo-stream.html','Content-Type':'application/x-www-form-urlencoded'},body});if(!response.ok)throw Error('Could not update tag');const page=new DOMParser().parseFromString(await response.text(),'text/html'),stream=page.querySelector('turbo-stream[target]'),replacement=stream?.querySelector('template')?.content.firstElementChild,target=stream&&document.getElementById(stream.getAttribute('target')),frame=page.querySelector('turbo-frame[id^=tagging_card_]');if(!target||!replacement||!frame)throw Error('Tag update missing');target.replaceWith(document.importNode(replacement,true));main.querySelector('turbo-frame[id^=tagging_card_]')?.replaceWith(document.importNode(frame,true));openTagPicker(main.querySelector('.tag-picker'))}catch(error){document.getElementById('tag-error').textContent=error.message;if(button)button.disabled=false}});
openTagPicker(main.querySelector('.tag-picker'));
</script></body></html>
