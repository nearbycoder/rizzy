<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark"><title>{{TITLE}} | Rizzy</title>
<style>
:root{font:19px/1.375 "Segoe UI",system-ui,sans-serif;color:#f4f5f6;background:#101b20}*{box-sizing:border-box}body{margin:0;min-height:100vh}a{color:inherit}.for-screen-reader{position:absolute;inline-size:1px;block-size:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.skip{position:absolute;left:-9999px}.skip:focus{left:12px;top:12px;z-index:20;background:#fff;color:#111;padding:7px}.site{height:52px;display:flex;justify-content:center;align-items:center;font-weight:800;font-size:22px}.site a{text-decoration:none}.header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:12px clamp(18px,3vw,38px)}.header__actions--start{justify-self:start}.header__actions--start a{font-size:14px;text-decoration:none;color:#afc7dc}.header__title{display:flex;align-items:center;gap:20px;max-width:100%;margin:0;font-size:28.5px;line-height:1.38;font-weight:900;text-align:center;white-space:nowrap}.header__title:before,.header__title:after{content:"";height:1px;flex:1;background:#3d4b52}main{max-width:1400px;margin:auto;padding:0 clamp(18px,3vw,38px) 90px}.cards{margin:4px auto 0}.cards__list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:19px;padding:12px}.display-contents,turbo-frame[role=presentation]{display:contents}.card{--card-color:oklch(74% .1293 256);--card-bg:color-mix(in srgb,var(--card-color) 4%,#101b20);--card-text:color-mix(in srgb,var(--card-color) 30%,#f4f5f6);position:relative;display:flex;flex-direction:column;min-height:107px;padding:11px;background:var(--card-bg);border:1px solid #35434b;border-radius:2px;font-size:11.4px;line-height:1.375;box-shadow:0 0 0 1px #0b1418}.card:hover,.card:focus-within{outline:1px solid var(--card-color)}.card--color-1{--card-color:oklch(62% .0122 260)}.card--color-2{--card-color:oklch(62% .0552 70)}.card--color-3{--card-color:oklch(62.1% .146 70)}.card--color-4{--card-color:oklch(62% .128 112)}.card--color-5{--card-color:oklch(62% .106 208)}.card--color-6{--card-color:oklch(62% .184 286)}.card--color-7{--card-color:oklch(62% .177 308)}.card--color-8{--card-color:oklch(62% .166 342)}.card__main{display:flex;flex:1;flex-direction:column;min-width:0}.card__link{position:absolute;inset:0;z-index:2}.card__header{display:flex;align-items:center;gap:5px;min-width:0;margin:-11px -11px 0;height:24px;white-space:nowrap}.card__board{display:flex;align-items:center;flex:0 1 auto;max-width:100%;min-width:0;background:var(--card-color);color:#0d1418;font-weight:700;line-height:15px;padding:4px 8px 4px 11px;border-radius:2px 0 2px 0;text-transform:uppercase}.card__id{flex:none}.card__board-name{min-width:0;border-left:1px solid #0d14185c;margin-left:7px;padding-left:7px}.overflow-ellipsis{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card__tags{display:flex;gap:5px;flex:0 1 auto;min-width:0;overflow:hidden;color:var(--card-color);font-weight:750;text-transform:uppercase}.card__tag{overflow:hidden;text-overflow:ellipsis}.card__steps{flex:none;color:var(--card-color);font-weight:800}.card__column-name{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;border:1px solid var(--card-color);border-radius:4px;padding:2px 6px;color:var(--card-color);font-weight:700;text-transform:uppercase}.card__body{display:flex;flex:1;min-width:0;padding:6px 0 5px}.card__content{min-width:0;width:100%}.card__title{margin:0;color:var(--card-text);font-size:18.24px;font-weight:900;line-height:1.15;letter-spacing:-.02em}.overflow-line-clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}.card__footer{display:flex;align-items:end;gap:6px;min-height:31px;color:var(--card-color);font-weight:650}.card__meta{display:grid;grid-template-columns:30px auto minmax(0,1fr) auto;grid-template-rows:16px 16px;column-gap:6px;align-items:center;min-width:0}.card__avatar{grid-column:1;grid-row:1/3;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#837329;color:#fff;font-size:11px}.card__meta-text{white-space:nowrap;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis}.card__meta-text--added{grid-column:2;grid-row:1}.card__meta-text--updated{grid-column:3;grid-row:1}.card__meta-text--author{grid-column:2/4;grid-row:2}.card__meta-text--assignees{grid-column:2/4;grid-row:3}.card__assignee-avatars{grid-column:4;grid-row:1/3;display:flex;align-items:center;padding-left:8px}.card__assignee-avatar{width:24px;height:24px;margin-left:-8px;border:1px solid var(--card-bg);border-radius:50%}.card__counts{display:flex;gap:8px;margin-left:auto;white-space:nowrap}.card__boosts,.card__comments{font-size:11px}.card--golden{box-shadow:0 0 0 1px #d8bf6a,0 0 10px #d8bf6a55}.blank-slate{grid-column:1/-1;text-align:center;color:#98a5ab;padding:20px}.blank-slate--drag{display:none}.pagination-link{grid-column:1/-1;display:block;width:max-content;margin:12px auto;color:#aacaff;font-size:14px}.card{isolation:isolate;overflow:hidden}.card__header,.card__body,.card__meta,.card__counts{position:relative;z-index:1}.card__background{position:absolute;inset:0;z-index:0;pointer-events:none}.card__background img{width:100%;height:100%;object-fit:cover;opacity:.6}@media(max-width:959px){.cards__list{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:639px){:root{font-size:16px}.header{grid-template-columns:1fr}.header__title{font-size:23px}.cards__list{grid-template-columns:1fr;padding:8px}}
</style>
<style>
.site{height:50px}.site-menu{position:relative;z-index:8}.site-menu>summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none}.site-menu>summary::-webkit-details-marker{display:none}.site-logo{display:flex;gap:2px;align-items:center;justify-content:center;width:29px;height:29px;border:1px solid #40505a;border-radius:7px;background:#182730}.site-logo i{display:block;height:18px;width:3px;border-radius:2px;background:#e65667}.site-logo i:nth-child(2){background:#eab548}.site-logo i:nth-child(3){background:#75bf74}.site-logo i:nth-child(4){background:#56a7d8}.site-logo i:nth-child(5){background:#a67bd7}.site-caret{font-size:13px;font-weight:400;margin-left:7px}.site-menu nav{position:absolute;top:34px;left:50%;transform:translateX(-50%);min-width:180px;display:grid;padding:7px;border:1px solid #53636a;border-radius:10px;background:#22313a;box-shadow:0 9px 30px #0008}.site-menu nav a{padding:8px 12px;border-radius:6px;font-size:15px}.site-menu nav a:hover{background:#354550}.header{padding:12px clamp(18px,4.6vw,60px) 5px}.header__actions--start a{font-size:20px;font-weight:800;color:#f4f5f6}.cards__list{gap:17px}.card__header .card__column-name{margin-left:auto}.card__meta-text--added,.card__meta-text--updated{border-right:1px solid #394b55;padding-right:8px}.card__avatar{background:#374a57}.bottom-bar{position:fixed;bottom:0;left:0;right:0;z-index:5;display:grid;grid-template-columns:repeat(3,1fr);height:50px;border-top:1px solid #34434b;background:#101b20}.bottom-bar a{display:grid;place-items:center;color:#a5afb4;text-decoration:none;text-transform:uppercase;font-size:14px;font-weight:700}.bottom-bar a:hover,.bottom-bar a:focus-visible{background:#20313b;color:#fff}@media(max-width:639px){.header__actions--start a{font-size:16px}}
</style>
<style>
.bottom-bar button{border:0;background:none;color:#a5afb4;text-transform:uppercase;font:inherit;font-size:14px;font-weight:700;cursor:pointer}.bottom-bar button:hover,.bottom-bar button:focus-visible{background:#20313b;color:#fff}.utility-panel{position:fixed;inset:auto 0 51px auto;width:min(430px,calc(100vw - 24px));max-height:65vh;margin:auto 12px 0 auto;padding:18px;border:1px solid #65737a;border-radius:12px;background:#1d2c35;color:#f4f5f6;box-shadow:0 10px 30px #0009}.utility-panel::backdrop{background:#0006}.utility-panel h2{font-size:20px;margin:0 35px 14px 0}.utility-close{position:absolute;top:10px;right:10px;border:0;background:none;color:#f4f5f6;font-size:26px;cursor:pointer}.utility-content{max-height:45vh;overflow:auto;display:grid;gap:7px}.utility-content a{display:block;padding:9px;border:1px solid #4f6069;border-radius:7px;text-decoration:none;font-size:15px}.utility-content p{margin:4px 0;color:#a5afb4;font-size:14px}.utility-search{width:100%;margin-bottom:12px;border:1px solid #65737a;border-radius:8px;background:#101b20;color:#fff;padding:9px;font-size:15px}
</style>
</head>
<body data-account="{{ACCOUNT}}">
<a class="skip" href="#main">Skip to main content</a>
<div id="global-container"><header class="site"><details class="site-menu"><summary><span class="site-logo" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>Rizzy<span class="site-caret">⌄</span></summary><nav><a href="/{{ACCOUNT}}/my/menu">Explore</a><a href="/{{ACCOUNT}}/boards">All boards</a><a href="/{{ACCOUNT}}/cards">All cards</a></nav></details></header>
<header class="header" id="header"><div class="header__actions header__actions--start"><a href="/{{ACCOUNT}}/boards/{{BOARD_ID}}">Back to {{BOARD_NAME}}</a></div><h1 class="header__title divider divider--fade full-width" data-bridge--title-target="header"><span class="overflow-ellipsis">{{TITLE}}</span></h1></header>
<main id="main"><section class="cards cards--grid"><turbo-frame id="{{FRAME}}"><div class="cards__list hide-scrollbar" data-drag-drop-item-container>{{CONTENT}}</div></turbo-frame></section></main></div>
<footer class="bottom-bar"><button type="button" data-utility="pins">Pinned</button><button type="button" data-utility="search">Search</button><button type="button" data-utility="notifications">Notifications</button></footer>
<dialog class="utility-panel" id="utility-panel"><button type="button" class="utility-close" aria-label="Close">×</button><h2 id="utility-title"></h2><input type="search" class="utility-search" id="utility-search" placeholder="Search all cards" aria-label="Search all cards" hidden><div class="utility-content" id="utility-content"></div></dialog>
<script>
const list=document.querySelector('.cards__list');
function relativeDates(){const today=new Date();const midnight=new Date(today.getFullYear(),today.getMonth(),today.getDate());for(const time of document.querySelectorAll('time[data-relative-date]')){const date=new Date(time.dateTime);if(Number.isNaN(date.getTime()))continue;const day=new Date(date.getFullYear(),date.getMonth(),date.getDate());const days=Math.round((midnight-day)/86400000);time.textContent=days===0?'today':days===1?'yesterday':days>1&&days<7?`${days} days ago`:date.toLocaleDateString(undefined,{month:'short',day:'numeric'});time.removeAttribute('data-relative-date')}}
const observer=new IntersectionObserver(entries=>{for(const entry of entries)if(entry.isIntersecting){observer.unobserve(entry.target);loadNext(entry.target)}},{rootMargin:'300px'});
function observe(){const link=list.querySelector('.pagination-link');if(link)observer.observe(link)}
async function loadNext(link){if(link.dataset.loading)return;link.dataset.loading='1';try{const response=await fetch(link.href,{headers:{Accept:'text/html'}});if(!response.ok)throw Error('Could not load more cards');const page=new DOMParser().parseFromString(await response.text(),'text/html');const frame=page.getElementById(link.dataset.frame);if(!frame)throw Error('Missing card page');link.closest('turbo-frame[role="presentation"]').after(frame);link.remove();relativeDates();observe()}catch(error){link.removeAttribute('data-loading');console.error(error)}}
list.addEventListener('click',event=>{const link=event.target.closest('.pagination-link');if(link){event.preventDefault();observer.unobserve(link);loadNext(link)}});
relativeDates();observe();
const account=document.body.dataset.account,utility=document.getElementById('utility-panel'),utilityTitle=document.getElementById('utility-title'),utilitySearch=document.getElementById('utility-search'),utilityContent=document.getElementById('utility-content');
function utilityList(items,empty){utilityContent.replaceChildren();if(!items.length){const message=document.createElement('p');message.textContent=empty;utilityContent.append(message);return}for(const item of items){const link=document.createElement('a');link.href=item.url;link.textContent=item.title;utilityContent.append(link)}}
async function loadUtility(kind,term=''){utilityContent.textContent='Loading…';try{const url=kind==='pins'?`/${account}/my/pins`:kind==='notifications'?`/${account}/notifications/tray`:`/${account}/search?q=${encodeURIComponent(term)}`;const response=await fetch(url,{headers:{Accept:'application/json'}});if(!response.ok)throw Error('Could not load');const data=await response.json();const rows=Array.isArray(data)?data:[];utilityList(rows.map(item=>kind==='notifications'?{url:item.card?.url||'#',title:item.card?.title||'Notification'}:{url:item.url,title:item.title}),kind==='pins'?'No pinned cards yet':kind==='notifications'?'No notifications':'No matching cards')}catch{utilityContent.textContent='Could not load items.'}}
document.querySelectorAll('[data-utility]').forEach(button=>button.addEventListener('click',()=>{const kind=button.dataset.utility;utilityTitle.textContent=kind==='pins'?'Pinned cards':kind==='notifications'?'Notifications':'Search cards';utilitySearch.hidden=kind!=='search';utilityContent.replaceChildren();utility.showModal();if(kind==='search'){utilitySearch.value='';utilitySearch.focus()}else loadUtility(kind)}));
utility.querySelector('.utility-close').addEventListener('click',()=>utility.close());utility.addEventListener('click',event=>{if(event.target===utility)utility.close()});let utilitySearchTimer;utilitySearch.addEventListener('input',()=>{clearTimeout(utilitySearchTimer);if(utilitySearch.value.trim())utilitySearchTimer=setTimeout(()=>loadUtility('search',utilitySearch.value.trim()),300);else utilityContent.replaceChildren()});
</script>
</body></html>
