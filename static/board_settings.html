<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{TITLE}} | Rizzy</title>
<style>
:root{font:16px/1.5 system-ui,sans-serif;color:#f5f0e8;background:#1b1b1b}*{box-sizing:border-box}body{margin:0}a{color:#e7bd61}button,input,textarea{font:inherit}button{cursor:pointer}.site{padding:18px max(20px,4vw);border-bottom:1px solid #383735;display:flex;gap:22px;align-items:center}.site strong{font-size:26px;letter-spacing:-.05em}.page{max-width:850px;margin:0 auto;padding:30px 20px 80px}h1{margin:0 0 24px;font-size:clamp(28px,4vw,40px)}h2{margin:0 0 12px;font-size:21px}.panel{background:#292826;border:1px solid #46433d;border-radius:16px;padding:22px;margin:18px 0}.stack{display:grid;gap:18px}.field{display:grid;gap:7px}.field>span{font-weight:700}input[type=text],textarea{width:100%;padding:11px 12px;color:#f5f0e8;background:#34322f;border:1px solid #666158;border-radius:8px}input[type=search]{width:100%;padding:10px 12px;color:inherit;background:#34322f;border:1px solid #666158;border-radius:8px}textarea{min-height:110px;resize:vertical}.button{border:1px solid #d5a94c;background:#e7bd61;color:#201b12;border-radius:9px;padding:9px 15px;font-weight:700}.button--secondary{border-color:#666158;background:#393733;color:#f6f0e8}.button--danger{border-color:#be655d;background:#5c2b28;color:#fff}.button:disabled{opacity:.45;cursor:not-allowed}.person{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid #45423c}.person-link{display:flex;gap:12px;align-items:center;min-width:0;flex:1;color:inherit;text-decoration:none}.person-link:hover strong{text-decoration:underline}.person-avatar{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:50%;background:#514b40;color:#f5f0e8;font-size:13px;font-weight:700}.person small{display:block;color:#afa89d}.person-switch input{width:19px;height:19px}.access-all .person-switch{display:none}.access-bulk{display:flex;justify-content:flex-end;gap:10px;align-items:center}.access-bulk button{border:0;background:none;color:#e7bd61;font-size:13px}.access-bulk button:disabled{color:#888}.options{display:flex;flex-wrap:wrap;gap:12px}.options label{display:flex;gap:6px;align-items:center;padding:8px;border:1px solid #57534d;border-radius:8px}.muted{color:#afa89d}.actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.error{color:#ffae9d}
</style></head>
<body data-board-path="{{BOARD_PATH}}"><header class="site"><strong>Rizzy</strong><a href="{{HOME_PATH}}">All boards</a>{{BOARD_LINK}}</header><main class="page">{{CONTENT}}</main>
<script>
const boardPath=document.body.dataset.boardPath;
const everyone=document.getElementById('board-all-access');
const accessControls=document.getElementById('board-access-controls');
const accessPeople=document.getElementById('board-access-people');
const accessCheckboxes=[...(accessPeople?.querySelectorAll('input[name="user_ids[]"]')||[])];
function updateAccessVisibility(){if(!everyone)return;accessControls.hidden=everyone.checked;accessPeople.classList.toggle('access-all',everyone.checked)}
everyone?.addEventListener('change',updateAccessVisibility);
updateAccessVisibility();
document.getElementById('board-access-filter')?.addEventListener('input',event=>{
  const term=event.target.value.toLocaleLowerCase();
  accessPeople.querySelectorAll('[data-board-access-person]').forEach(person=>{person.hidden=!person.textContent.toLocaleLowerCase().includes(term)});
});
document.getElementById('access-select-all')?.addEventListener('click',()=>{accessCheckboxes.forEach(input=>{input.checked=true})});
document.getElementById('access-select-none')?.addEventListener('click',()=>{accessCheckboxes.forEach(input=>{if(input.id!=='current-user-access')input.checked=false})});
async function submitBoardFrame(form){
  const response=await fetch(form.action,{method:'POST',headers:{Accept:'text/vnd.turbo-stream.html'},body:new URLSearchParams(new FormData(form))});
  if(!response.ok)return false;
  const streams=new DOMParser().parseFromString(await response.text(),'text/html').querySelectorAll('turbo-stream');
  streams.forEach(stream=>{
    const current=document.getElementById(stream.getAttribute('target'));
    const template=stream.querySelector('template');
    if(current&&template)current.replaceWith(template.content.cloneNode(true));
  });
  return true;
}
document.addEventListener('change',async event=>{
  if(event.target.matches('input[name="board[auto_postpone_period_in_days]"]')){
    const form=event.target.form;
    if(!await submitBoardFrame(form))alert('Could not change auto close period');
  }else if(event.target.matches('input[name="board[slider]"]')){
    const form=event.target.form;
    const radio=form.querySelectorAll('input[name="board[auto_postpone_period_in_days]"]')[Number(event.target.value)];
    if(radio){radio.checked=true;if(!await submitBoardFrame(form))alert('Could not change auto close period')}
  }else if(event.target.matches('#publication-toggle')){
    const previous=!event.target.checked;
    if(!await submitBoardFrame(event.target.form)){
      event.target.checked=previous;
      alert('Could not change public link');
    }
  }
});
document.getElementById('delete-board')?.addEventListener('click',async()=>{
  if(!confirm('Delete this board and all its cards? This cannot be undone.'))return;
  const response=await fetch(boardPath,{method:'DELETE',headers:{Accept:'application/json'}});
  if(response.ok)location.href=`/${boardPath.split('/')[1]}/`;else alert('Could not delete board');
});
document.getElementById('settings-form')?.addEventListener('submit',event=>{
  const me=document.getElementById('current-user-access'),everyone=document.getElementById('board-all-access');
  if(me&&!me.checked&&!everyone.checked&&!confirm('Remove yourself from this board? You will need an invitation to regain access.'))event.preventDefault();
});
</script></body></html>
