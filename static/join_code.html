<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{TITLE}} | Rizzy</title>
<style>:root{font:16px/1.5 system-ui,sans-serif;background:#1b1b1b;color:#f5f0e8}*{box-sizing:border-box}body{margin:0}a{color:#e7bd61}button,input{font:inherit}.site{padding:18px max(20px,4vw);border-bottom:1px solid #383735;display:flex;gap:22px;align-items:center}.site strong{font-size:26px;letter-spacing:-.05em}.page{max-width:720px;margin:30px auto;padding:0 20px}.panel{background:#292826;border:1px solid #46433d;border-radius:16px;padding:30px;margin-top:24px;text-align:center}.panel h1{font-size:32px;margin:0 0 8px}.link-row{display:flex;gap:10px;margin:22px 0}.link-row input{min-width:0;flex:1;background:#34322f;color:#f5f0e8;border:1px solid #666158;border-radius:8px;padding:10px}.panel button{background:#4b422f;color:#f5f0e8;border:1px solid #a58c58;border-radius:8px;padding:9px 14px;cursor:pointer}.panel footer{border-top:1px solid #514d45;margin-top:28px;padding-top:20px;color:#bdb6a9}.panel footer a{margin-left:10px}.panel form{display:grid;justify-items:center;gap:13px}.limit{width:9ch;text-align:center;font-size:24px;background:#34322f;color:#f5f0e8;border:1px solid #666158;border-radius:8px;padding:8px}.subtle{color:#afa89d}.error{color:#ffae9d}.sr-only{position:absolute;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden}</style></head><body><header class="site"><strong>Rizzy</strong><a href="/{{ACCOUNT}}/">All boards</a></header><main class="page">{{CONTENT}}</main>
<script>
document.getElementById('copy-link')?.addEventListener('click',async()=>{const input=document.getElementById('invite-url');try{await navigator.clipboard.writeText(input.value);document.getElementById('copy-link').textContent='Copied!'}catch{input.select();document.execCommand('copy')}});
document.getElementById('reset-link')?.addEventListener('click',async event=>{if(!confirm('Are you sure you want to generate a new link? The previous code will stop working.'))return;const response=await fetch(event.currentTarget.dataset.url,{method:'DELETE',headers:{Accept:'text/html'}});if(response.ok)location.href=event.currentTarget.dataset.url;else alert('Could not generate a new link')});
</script></body></html>
