<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account Settings | Rizzy</title>
<style>
:root{font:16px/1.5 system-ui,sans-serif;color:#f5f0e8;background:#1b1b1b}*{box-sizing:border-box}body{margin:0}a{color:#e7bd61}button,input{font:inherit}button{cursor:pointer}.site{padding:18px max(20px,4vw);border-bottom:1px solid #383735;display:flex;gap:22px;align-items:center}.site strong{font-size:26px;letter-spacing:-.05em}.page{max-width:1150px;margin:0 auto;padding:28px 20px 80px}h1{font-size:clamp(28px,4vw,40px);margin:0 0 18px}h2{font-size:20px;margin:0 0 12px}.subtle{color:#aaa49b;margin-top:-14px}.settings{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#292826;border:1px solid #46433d;border-radius:16px;overflow:hidden}.section{padding:24px}.section+.section{border-top:1px solid #514d45}.section p{color:#d0c9bc}.section--name form{display:flex;gap:8px}.account-name{width:100%;font-size:22px;font-weight:700;background:transparent;border:0;border-bottom:1px solid #666158;color:#f5f0e8;padding:4px 0}.account-name:focus{outline:2px solid #e7bd61;border-radius:4px}.save-name{border:1px solid #e7bd61;background:#554624;color:#f5f0e8;border-radius:50%;width:40px;height:40px}.people{list-style:none;margin:0;padding:0;max-height:480px;overflow:auto}.person{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #45423c}.person__profile{min-width:0;display:flex;gap:10px;align-items:center;color:#f5f0e8;text-decoration:none}.person__profile img{width:38px;height:38px;border-radius:50%;object-fit:cover}.person__profile span{min-width:0;overflow:hidden;text-overflow:ellipsis}.person__profile small{display:block;color:#afa89d;overflow:hidden;text-overflow:ellipsis}.person__controls{display:flex;gap:8px;align-items:center;white-space:nowrap;font-size:12px}.person__controls label{display:flex;align-items:center;gap:4px}.person__controls button{padding:5px 8px;background:#4d2927;color:#ffcfca;border:1px solid #935b53;border-radius:6px}.person__controls :disabled{opacity:.5;cursor:default}#people-filter{width:100%;padding:9px 10px;border:1px solid #666158;background:#34322f;color:#fff;border-radius:8px;margin-bottom:10px}.invite{display:inline-block;margin-top:16px}.entropy-options{display:flex;gap:8px;flex-wrap:wrap}.entropy-options label{display:grid;place-items:center;min-width:55px;padding:10px;border:1px solid #70685b;border-radius:9px;cursor:pointer}.entropy-options label:has(input:checked){background:#e7bd61;color:#19150d}.entropy-options input{position:absolute;opacity:0}.entropy-options label:has(input:focus-visible){outline:2px solid #fff}.days-label{font-size:13px;color:#afa89d;margin-top:8px}#begin-export,dialog button{border:1px solid #a58c58;border-radius:8px;padding:9px 14px;background:#403a2d;color:#f5f0e8}dialog{max-width:48ch;border:1px solid #777066;border-radius:16px;background:#292826;color:#f5f0e8;padding:24px}dialog::backdrop{background:#000a}dialog form{display:flex;gap:12px;justify-content:center}.error{color:#ffae9d}@media(max-width:820px){.settings{grid-template-columns:1fr}.person__controls label{font-size:0}}
</style></head><body data-account="{{ACCOUNT}}"><header class="site"><strong>Rizzy</strong><a href="/{{ACCOUNT}}/">All boards</a></header><main class="page" id="main">{{CONTENT}}</main>
<script>
const account=document.body.dataset.account;
document.getElementById('people-filter')?.addEventListener('input',event=>{const query=event.target.value.toLocaleLowerCase();document.querySelectorAll('[data-filter-item]').forEach(item=>item.hidden=!item.textContent.toLocaleLowerCase().includes(query))});
document.querySelectorAll('#entropy-form input[type=radio]').forEach(input=>input.addEventListener('change',()=>input.form.requestSubmit()));
document.getElementById('begin-export')?.addEventListener('click',()=>document.getElementById('export-dialog').showModal());
document.getElementById('cancel-export')?.addEventListener('click',()=>document.getElementById('export-dialog').close());
document.querySelectorAll('.role-toggle').forEach(input=>input.addEventListener('change',async()=>{const response=await fetch(`/${account}/users/${input.dataset.user}/role`,{method:'PATCH',headers:{Accept:'application/json','Content-Type':'application/json'},body:JSON.stringify({user:{role:input.checked?'admin':'member'}})});if(!response.ok){input.checked=!input.checked;alert('Could not change role')}else location.reload()}));
document.querySelectorAll('.remove-user').forEach(button=>button.addEventListener('click',async()=>{if(!confirm('Are you sure you want to permanently remove this person from the account?'))return;const response=await fetch(`/${account}/users/${button.dataset.user}`,{method:'DELETE',headers:{Accept:'application/json'}});if(response.ok)location.reload();else alert('Could not remove this person')}));
</script></body></html>
