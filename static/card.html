<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}} | Rizzy</title>
<link rel="stylesheet" href="/assets/lexxy/lexxy.css">
<link rel="stylesheet" href="/assets/lexxy/rizzy-dark.css">
<script type="importmap">{"imports":{"@rails/activestorage":"/assets/lexxy/activestorage.esm.js"}}</script>
<script type="module" src="/assets/lexxy/lexxy.js"></script>
<style>
:root{font:16px/1.5 system-ui,sans-serif;color:#f5f0e8;background:#1b1b1b}*{box-sizing:border-box}body{margin:0}a{color:inherit}button,textarea,input{font:inherit}.skip{position:absolute;left:-9999px}.skip:focus{left:16px;top:12px;z-index:10}header.site{height:70px;display:flex;align-items:center;padding:0 max(20px,4vw);border-bottom:1px solid #383735}header.site a{font-size:29px;font-weight:800;letter-spacing:-.055em;text-decoration:none}main{width:min(900px,calc(100% - 32px));margin:36px auto 70px}nav a{color:#d6c9b5;text-decoration:none;font-weight:650}nav a:hover{text-decoration:underline}.card-perma{margin-top:24px;background:#292826;border:1px solid #46433d;border-radius:18px;box-shadow:0 14px 40px #0005;overflow:hidden}.card__header{padding:18px 28px 15px;border-bottom:1px solid #45433e;color:#bbb5aa;font-size:14px;display:flex;justify-content:space-between;gap:12px}.card__header strong{color:#f5f0e8}.card__body{padding:24px 28px 28px}.card__title{font-size:clamp(28px,5vw,42px);line-height:1.15;letter-spacing:-.045em;margin:0 0 20px}.card__description{min-height:24px;overflow-wrap:anywhere}.card__description a{color:#e7bd61}.card__footer{padding:18px 28px;background:#242320;border-top:1px solid #45433e;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.byline,.muted{color:#afa89d;font-size:14px}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button{border:1px solid #d5a94c;background:#e7bd61;color:#201b12;border-radius:9px;padding:9px 15px;font-weight:700;cursor:pointer}button:hover{background:#f0ca77}button.secondary{border-color:#666158;background:#393733;color:#f6f0e8}button.secondary:hover{background:#4a463f}button:disabled{opacity:.5;cursor:wait}textarea,input{display:block;width:100%;margin:8px 0 18px;border:1px solid #57534d;background:#201f1e;color:#f8f4ed;border-radius:10px;padding:12px 14px;outline:none}textarea:focus,input:focus{border-color:#e6b857;box-shadow:0 0 0 3px #e6b85729}label{display:block;color:#d1cbc1;font-size:14px;font-weight:600}lexxy-editor{display:block;min-height:160px;margin:8px 0 18px;border:1px solid #57534d;background:#201f1e;color:#f8f4ed;border-radius:10px;padding:12px 14px}lexxy-editor:focus-within{border-color:#e6b857;box-shadow:0 0 0 3px #e6b85729}lexxy-toolbar button{border:0;background:transparent;color:#f8f4ed;padding:6px}lexxy-toolbar button:hover{background:#48443e}section.messages{margin-top:42px}.messages h2{font-size:22px;letter-spacing:-.03em}.comment{padding:18px 0;border-top:1px solid #45433e}.comment h3{font-size:15px;margin:0 0 8px}.comment time{font-weight:400;color:#afa89d}.comment__body{overflow-wrap:anywhere}.comment__body a{color:#e7bd61}.empty{color:#afa89d}.steps{margin:24px 0 0;padding-left:22px}.steps li{padding:3px 0}details.editor{border-top:1px solid #45433e;padding:20px 28px}details.editor summary{cursor:pointer;font-weight:700}details.editor form{margin-top:18px}.error{color:#ff9f96;min-height:24px}.status{border:1px solid #736348;border-radius:99px;padding:3px 9px;font-size:12px;font-weight:700;color:#e7bd61}@media(max-width:600px){main{margin-top:22px}.card__header,.card__body,.card__footer,details.editor{padding-left:18px;padding-right:18px}}
</style>
</head>
<body data-account="{{ACCOUNT}}" data-number="{{NUMBER}}">
<a class="skip" href="#main">Skip to main content</a><header class="site"><a href="/">Rizzy</a></header>
<main id="main">
<nav><a href="/{{ACCOUNT}}/boards/{{BOARD_ID}}">← Back to {{BOARD_NAME}}</a></nav>
<article class="card-perma" id="card">
  <div class="card__header"><span>#{{NUMBER}} · <strong>{{BOARD_NAME}}</strong></span>{{STATUS}}</div>
  <div class="card__body"><h1 class="card__title">{{TITLE}}</h1><div class="card__description lexxy-content">{{DESCRIPTION_HTML}}</div>{{STEPS}}</div>
  <div class="card__footer"><span class="byline">By {{CREATOR_NAME}} · {{CREATED_AT}}</span><div class="actions">
    <button id="watch" class="secondary" type="button">{{WATCH_LABEL}}</button>
    <button id="pin" class="secondary" type="button">{{PIN_LABEL}}</button>
    <button id="closure" type="button">{{CLOSURE_LABEL}}</button>
  </div></div>
  <details class="editor" id="edit"><summary>Edit card</summary><form id="edit-form">
    <label for="title">Name it</label><textarea id="title" maxlength="255" required>{{TITLE}}</textarea>
    <label for="description">Add some notes, context, pictures, or video</label>
    <lexxy-editor id="description" name="card[description]" value="{{DESCRIPTION_VALUE}}" placeholder="Add some notes, context, pictures, or video about this…" data-direct-upload-url="/{{ACCOUNT}}/rails/active_storage/direct_uploads" data-blob-url-template="/{{ACCOUNT}}/rails/active_storage/blobs/redirect/:signed_id/:filename">
      <lexxy-prompt trigger="@" src="/{{ACCOUNT}}/prompts/boards/{{BOARD_ID}}/users" name="mention"></lexxy-prompt>
      <lexxy-prompt trigger="#" src="/{{ACCOUNT}}/prompts/cards" name="card" insert-editable-text="true" remote-filtering="true" supports-space-in-searches="true"></lexxy-prompt>
    </lexxy-editor><button type="submit">Save changes</button><p class="error" role="alert" id="edit-error"></p>
  </form></details>
</article>
<section class="messages" aria-labelledby="messages-heading"><h2 id="messages-heading">Comments</h2><div id="comments">{{COMMENTS}}</div>
  <form id="comment-form"><label for="comment">Add a comment</label>
  <lexxy-editor id="comment" name="comment[body]" required placeholder="Add your thoughts…" data-direct-upload-url="/{{ACCOUNT}}/rails/active_storage/direct_uploads" data-blob-url-template="/{{ACCOUNT}}/rails/active_storage/blobs/redirect/:signed_id/:filename">
    <lexxy-prompt trigger="@" src="/{{ACCOUNT}}/prompts/boards/{{BOARD_ID}}/users" name="mention"></lexxy-prompt>
    <lexxy-prompt trigger="#" src="/{{ACCOUNT}}/prompts/cards" name="card" insert-editable-text="true" remote-filtering="true" supports-space-in-searches="true"></lexxy-prompt>
  </lexxy-editor><button type="submit">Post</button><p class="error" role="alert" id="comment-error"></p></form>
</section>
</main>
<script>
const account=document.body.dataset.account,number=document.body.dataset.number;
async function mutation(path,method,body){const r=await fetch(`/${account}/cards/${number}${path}`,{method,headers:{Accept:'application/json','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!r.ok){let message=`Request failed (${r.status})`;try{const result=await r.json();message=result.message||message}catch{}throw Error(message)}return r}
function action(button,path,method){button.addEventListener('click',async()=>{button.disabled=true;try{await mutation(path,method);location.reload()}catch(error){button.disabled=false;alert(error.message)}})}
action(document.getElementById('closure'),'/closure','{{CLOSURE_METHOD}}');
action(document.getElementById('watch'),'/watch','{{WATCH_METHOD}}');
action(document.getElementById('pin'),'/pin','{{PIN_METHOD}}');
document.getElementById('edit-form').addEventListener('submit',async event=>{event.preventDefault();const button=event.submitter;button.disabled=true;const error=document.getElementById('edit-error');error.textContent='';try{await mutation('','PATCH',{card:{title:document.getElementById('title').value,description:document.getElementById('description').value}});location.reload()}catch(ex){error.textContent=ex.message;button.disabled=false}});
document.getElementById('comment-form').addEventListener('submit',async event=>{event.preventDefault();const button=event.submitter;button.disabled=true;const error=document.getElementById('comment-error');error.textContent='';try{await mutation('/comments','POST',{comment:{body:document.getElementById('comment').value}});location.reload()}catch(ex){error.textContent=ex.message;button.disabled=false}});
</script>
</body></html>
