.card__tags{display:flex;align-items:center;gap:8px;min-width:0;padding:4px 9px}.card__tag-picker-button{width:31px;height:31px;display:grid;place-items:center;padding:0;border:1px solid #526d80;border-radius:50%;background:transparent;color:#a8cbf2;font-size:20px}.card__tag-picker-button:hover{background:#203d57}.tag-dialog{width:min(410px,calc(100vw - 24px));max-height:75vh;padding:20px;border:1px solid #65737a;border-radius:12px;background:#1d2c35;color:#f4f5f6;box-shadow:0 10px 30px #0009}.tag-dialog::backdrop{background:#0008}.tag-dialog__close{float:right;border:0;background:none;color:#f4f5f6}.tag-dialog .popup__list{max-height:48vh;overflow:auto;margin:10px 0;padding:0;list-style:none}.tag-dialog .popup__item button{width:100%;display:flex;justify-content:space-between;padding:9px;border:0;background:transparent;color:#f4f5f6;text-align:left}.tag-dialog .popup__item button:hover{background:#304553}.tag-dialog .popup__item[hidden]{display:none}.tag-dialog input{margin:10px 0}.tag-dialog__error{min-height:0}
.card__header{justify-content:flex-start;z-index:3}.card__board-label a{margin-left:3px;padding-left:14px;border-left:1px solid #4d7fbb;color:#101b20;text-decoration:none;font-weight:850;text-transform:uppercase}
.messages{width:min(995px,calc(100% - 120px));margin:42px auto}.messages h2{color:#f4f5f6}.comment{border-color:#344b5b}details.editor{background:#101b20;border-color:#344b5b}details.editor summary{color:#a8cbf2}textarea,input{background:#172731;border-color:#536574;color:#f4f5f6}button{border-color:#6288af;background:#87b9fa;color:#101b20}button:hover{background:#a6cbfa}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;z-index:5;display:grid;grid-template-columns:repeat(3,1fr);height:50px;border-top:1px solid #34434b;background:#101b20}.bottom-bar button{border:0;background:none;color:#a5afb4;text-transform:uppercase;font-size:14px;font-weight:700;cursor:pointer}.bottom-bar button:hover,.bottom-bar button:focus-visible{background:#20313b;color:#fff}.utility-panel{position:fixed;inset:auto 0 51px auto;width:min(430px,calc(100vw - 24px));max-height:65vh;margin:auto 12px 0 auto;padding:18px;border:1px solid #65737a;border-radius:12px;background:#1d2c35;color:#f4f5f6;box-shadow:0 10px 30px #0009}.utility-panel::backdrop{background:#0006}.utility-panel h2{font-size:20px;margin:0 35px 14px 0}.utility-close{position:absolute;top:10px;right:10px;border:0;background:none;color:#f4f5f6;font-size:26px;cursor:pointer}.utility-content{max-height:45vh;overflow:auto;display:grid;gap:7px}.utility-content a{display:block;padding:9px;border:1px solid #4f6069;border-radius:7px;text-decoration:none;font-size:15px}.utility-content p{margin:4px 0;color:#a5afb4;font-size:14px}.utility-search{width:100%;margin-bottom:12px;border:1px solid #65737a;border-radius:8px;background:#101b20;color:#fff;padding:9px;font-size:15px}
.card__body{min-height:370px}
.actions>a.secondary{display:inline-flex;align-items:center;padding:9px 15px;border:1px solid #53718e;border-radius:9px;background:#243b50;color:#e0ecf4;text-decoration:none;font-weight:700}.card__meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.card__meta-text--assignees{font-size:14px;color:#b5cce0}.assignment-dialog{width:min(410px,calc(100vw - 24px));max-height:75vh;padding:20px;border:1px solid #65737a;border-radius:12px;background:#1d2c35;color:#f4f5f6;box-shadow:0 10px 30px #0009}.assignment-dialog::backdrop{background:#0008}.assignment-dialog .popup__list{max-height:48vh;overflow:auto;margin:10px 0;padding:0;list-style:none}.assignment-dialog .popup__item button{width:100%;display:flex;justify-content:space-between;padding:9px;border:0;background:transparent;color:#f4f5f6;text-align:left}.assignment-dialog .popup__item button:hover{background:#304553}.assignment-dialog .popup__item[hidden]{display:none}.assignment-dialog input{margin:10px 0}.assignment-dialog__close{float:right;border:0;background:none;color:#f4f5f6}

</head>
<body data-account="{{ACCOUNT}}" data-number="{{NUMBER}}">
<a class="skip" href="#main">Skip to main content</a><header class="site"><a href="/{{ACCOUNT}}/my/menu"><span class="site-logo" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>Rizzy⌄</a></header>
<main id="main">
<nav><a href="/{{ACCOUNT}}/boards/{{BOARD_ID}}">Back to {{BOARD_NAME}}</a></nav>
<article class="card-perma{{IMAGE_CLASS}}" id="card">
  {{IMAGE}}
  <button id="gold" class="side-action side-action--gold" type="button" aria-label="{{GOLD_LABEL}}" title="{{GOLD_LABEL}}">★</button>
  {{IMAGE_BUTTON}}
  <div class="card__header"><span class="card__board-label">No. <strong>{{NUMBER}}</strong><a href="/{{ACCOUNT}}/cards/{{NUMBER}}/board/edit" aria-label="Move this card to another board">{{BOARD_NAME}}⌄</a></span>{{TAG_CONTROL}}{{STATUS}}</div>
  <div class="card__body"><div class="card__content"><h1 class="card__title">{{TITLE}}</h1><div class="card__description lexxy-content">{{DESCRIPTION_HTML}}</div>{{STEPS}}</div>{{STAGE_RAIL}}</div>
  <div class="card__footer">{{ASSIGNMENT_META}}<div class="actions">
    <a class="secondary" id="assignment-link" href="/{{ACCOUNT}}/cards/{{NUMBER}}/assignments/new" aria-label="Assign this card">Assign</a>
    <a class="secondary" href="/{{ACCOUNT}}/cards/{{NUMBER}}/reactions/new" aria-label="React to this card">React</a>
    <button id="watch" class="secondary side-action side-action--watch" type="button" aria-label="{{WATCH_LABEL}}" title="{{WATCH_LABEL}}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 9h18c0-1-3-2-3-9M10 21h4"/></svg></button>
    <button id="pin" class="secondary side-action side-action--pin" type="button" aria-label="{{PIN_LABEL}}" title="{{PIN_LABEL}}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3 6 0-1 7 3 3v2H7v-2l3-3-1-7ZM12 15v6"/></svg></button>
    <button id="choose-column" class="secondary" type="button" aria-expanded="false" aria-controls="column-picker">Move</button>
    <button id="closure" type="button">{{CLOSURE_LABEL}}</button>
  </div></div>
  <section id="column-picker" class="column-picker" aria-label="Choose a column for this card" hidden></section>
  <dialog class="assignment-dialog" id="assignment-dialog" aria-label="Assign this card"><button type="button" class="assignment-dialog__close" aria-label="Close assignment picker">×</button><div id="assignment-dialog-content"></div><p class="error" role="alert" id="assignment-dialog-error"></p></dialog>
  <details class="editor" id="edit"><summary>Edit card</summary><form id="edit-form">
    <label for="title">Name it</label><textarea id="title" maxlength="255" required>{{TITLE}}</textarea>
    <label for="description">Add some notes, context, pictures, or video</label>
    <lexxy-editor id="description" name="card[description]" value="{{DESCRIPTION_VALUE}}" placeholder="Add some notes, context, pictures, or video about this…" data-direct-upload-url="/{{ACCOUNT}}/rails/active_storage/direct_uploads" data-blob-url-template="/{{ACCOUNT}}/rails/active_storage/blobs/redirect/:signed_id/:filename">
      <lexxy-prompt trigger="@" src="/{{ACCOUNT}}/prompts/boards/{{BOARD_ID}}/users" name="mention"></lexxy-prompt>
      <lexxy-prompt trigger="#" src="/{{ACCOUNT}}/prompts/cards" name="card" insert-editable-text="true" remote-filtering="true" supports-space-in-searches="true"></lexxy-prompt>
    </lexxy-editor><button type="submit">Save changes</button><p class="error" role="alert" id="edit-error"></p>
  </form></details>
</article>
<section class="messages" aria-labelledby="messages-heading"><h2 id="messages-heading">Comments</h2><div id="comments">{{COMMENTS}}{{NEW_COMMENT_FORM}}</div></section>
</main>
<footer class="bottom-bar"><button type="button" data-utility="pins">Pinned</button><button type="button" data-utility="search">Search</button><button type="button" data-utility="notifications">Notifications</button></footer>
<dialog class="utility-panel" id="utility-panel"><button type="button" class="utility-close" aria-label="Close">×</button><h2 id="utility-title"></h2><input type="search" class="utility-search" id="utility-search" placeholder="Search all cards" aria-label="Search all cards" hidden><div class="utility-content" id="utility-content"></div></dialog>
<script>
const account=document.body.dataset.account,number=document.body.dataset.number;
const assignmentLink=document.getElementById('assignment-link'),assignmentDialog=document.getElementById('assignment-dialog'),assignmentContent=document.getElementById('assignment-dialog-content'),assignmentError=document.getElementById('assignment-dialog-error');
assignmentLink.addEventListener('click',async event=>{event.preventDefault();assignmentError.textContent='';assignmentDialog.showModal();if(assignmentContent.firstElementChild){assignmentContent.querySelector('#user-search')?.focus();return}assignmentContent.textContent='Loading…';try{const response=await fetch(assignmentLink.href,{headers:{Accept:'text/html'}});if(!response.ok)throw Error('Could not load assignment picker');const page=new DOMParser().parseFromString(await response.text(),'text/html'),frame=page.querySelector('turbo-frame[id^=assignment_card_]');if(!frame)throw Error('Assignment picker missing');assignmentContent.replaceChildren(document.importNode(frame,true));assignmentContent.querySelector('#user-search')?.focus()}catch(error){assignmentContent.textContent='';assignmentError.textContent=error.message}});
assignmentDialog.querySelector('.assignment-dialog__close').addEventListener('click',()=>assignmentDialog.close());assignmentDialog.addEventListener('click',event=>{if(event.target===assignmentDialog)assignmentDialog.close()});assignmentContent.addEventListener('input',event=>{if(event.target.id!=='user-search')return;const value=event.target.value.toLocaleLowerCase();assignmentContent.querySelectorAll('.popup__item').forEach(item=>item.hidden=!item.textContent.toLocaleLowerCase().includes(value))});
assignmentContent.addEventListener('submit',async event=>{const form=event.target;if(!form.closest('turbo-frame'))return;event.preventDefault();const button=event.submitter;button.disabled=true;assignmentError.textContent='';try{const response=await fetch(form.action,{method:'POST',headers:{Accept:'text/vnd.turbo-stream.html'}});if(!response.ok)throw Error('Could not update assignment');const page=new DOMParser().parseFromString(await response.text(),'text/html'),stream=page.querySelector('turbo-stream[target]'),replacement=stream?.querySelector('template')?.content.firstElementChild,target=stream&&document.getElementById(stream.getAttribute('target')),frame=page.querySelector('turbo-frame[id^=assignment_card_]');if(!target||!replacement||!frame)throw Error('Assignment update missing');target.replaceWith(document.importNode(replacement,true));assignmentContent.replaceChildren(document.importNode(frame,true));assignmentDialog.close()}catch(error){assignmentError.textContent=error.message;button.disabled=false}});
async function mutation(path,method,body){const r=await fetch(`/${account}/cards/${number}${path}`,{method,headers:{Accept:'application/json','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!r.ok){let message=`Request failed (${r.status})`;try{const result=await r.json();message=result.message||message}catch{}throw Error(message)}return r}
function action(button,path,method){button.addEventListener('click',async()=>{button.disabled=true;try{await mutation(path,method);location.reload()}catch(error){button.disabled=false;alert(error.message)}})}
action(document.getElementById('closure'),'/closure','{{CLOSURE_METHOD}}');
action(document.getElementById('watch'),'/watch','{{WATCH_METHOD}}');
action(document.getElementById('pin'),'/pin','{{PIN_METHOD}}');
action(document.getElementById('gold'),'/goldness','{{GOLD_METHOD}}');
document.getElementById('remove-image')?.addEventListener('click',async event=>{const button=event.currentTarget;button.disabled=true;try{const response=await fetch(`/${account}/cards/${number}/image`,{method:'DELETE',headers:{Accept:'application/json'}});if(!response.ok)throw Error('Could not remove image');location.reload()}catch(error){button.disabled=false;alert(error.message)}});
const cardHeader=document.querySelector('.card__header');
cardHeader.addEventListener('click',async event=>{const trigger=event.target.closest('[data-tag-picker-url]');if(trigger){const dialog=trigger.closest('.card__tags').querySelector('.tag-dialog'),content=dialog.querySelector('.tag-dialog__content'),error=dialog.querySelector('.tag-dialog__error');error.textContent='';dialog.showModal();if(content.firstElementChild){content.querySelector('#tag-search')?.focus();return}content.textContent='Loading…';try{const response=await fetch(trigger.dataset.tagPickerUrl,{headers:{Accept:'text/html'}});if(!response.ok)throw Error('Could not load tag picker');const page=new DOMParser().parseFromString(await response.text(),'text/html'),frame=page.querySelector('turbo-frame[id^=tagging_card_]');if(!frame)throw Error('Tag picker missing');content.replaceChildren(document.importNode(frame,true));content.querySelector('#tag-search')?.focus()}catch(ex){content.textContent='';error.textContent=ex.message}return}const close=event.target.closest('.tag-dialog__close');if(close)close.closest('dialog').close()});
cardHeader.addEventListener('input',event=>{if(event.target.id!=='tag-search')return;const value=event.target.value.toLocaleLowerCase();event.target.closest('.tag-dialog').querySelectorAll('.popup__item[data-filter-target]').forEach(item=>item.hidden=!item.textContent.toLocaleLowerCase().includes(value))});
cardHeader.addEventListener('submit',async event=>{const form=event.target;if(!form.closest('.tag-dialog'))return;event.preventDefault();const button=event.submitter,dialog=form.closest('.tag-dialog'),error=dialog.querySelector('.tag-dialog__error');if(button)button.disabled=true;error.textContent='';try{const body=new URLSearchParams(new FormData(form)),response=await fetch(form.action,{method:'POST',headers:{Accept:'text/vnd.turbo-stream.html','Content-Type':'application/x-www-form-urlencoded'},body});if(!response.ok)throw Error('Could not update tag');const page=new DOMParser().parseFromString(await response.text(),'text/html'),stream=page.querySelector('turbo-stream[target]'),replacement=stream?.querySelector('template')?.content.firstElementChild,target=stream&&document.getElementById(stream.getAttribute('target')),frame=page.querySelector('turbo-frame[id^=tagging_card_]');if(!target||!replacement||!frame)throw Error('Tag update missing');replacement.querySelector('.tag-dialog__content')?.append(document.importNode(frame,true));dialog.close();target.replaceWith(document.importNode(replacement,true))}catch(ex){error.textContent=ex.message;if(button)button.disabled=false}});
const chooseColumn=document.getElementById('choose-column'),columnPicker=document.getElementById('column-picker');
chooseColumn.addEventListener('click',async()=>{if(!columnPicker.hidden){columnPicker.hidden=true;chooseColumn.setAttribute('aria-expanded','false');return}chooseColumn.disabled=true;try{const response=await fetch(`/${account}/cards/${number}/column/edit`,{headers:{Accept:'text/html'}});if(!response.ok)throw Error(`Request failed (${response.status})`);columnPicker.innerHTML=await response.text();columnPicker.hidden=false;chooseColumn.setAttribute('aria-expanded','true')}catch(error){alert(error.message)}finally{chooseColumn.disabled=false}});
async function chooseStage(button){if(button.disabled||button.getAttribute('aria-checked')==='true')return;const stage=button.dataset.stage;const action=stage==='not_now'?['/not_now','POST']:stage==='maybe'?['/triage','DELETE']:stage==='done'?['/closure','POST']:['/triage','POST'];button.disabled=true;try{await mutation(action[0],action[1],stage==='column'?{column_id:button.dataset.columnId}:undefined);location.reload()}catch(error){button.disabled=false;alert(error.message)}}
columnPicker.addEventListener('click',event=>{const button=event.target.closest('button[data-stage]');if(button)chooseStage(button)});
document.querySelector('.stage-rail').addEventListener('click',event=>{const button=event.target.closest('button[data-stage]');if(button)chooseStage(button)});
document.querySelectorAll('[data-step-id]').forEach(checkbox=>checkbox.addEventListener('change',async()=>{checkbox.disabled=true;try{const response=await fetch(`/${account}/cards/${number}/steps/${checkbox.dataset.stepId}`,{method:'PUT',headers:{Accept:'application/json','Content-Type':'application/json'},body:JSON.stringify({step:{completed:checkbox.checked}})});if(!response.ok)throw Error('Could not update step');checkbox.closest('li').classList.toggle('is-completed',checkbox.checked)}catch(error){checkbox.checked=!checkbox.checked;alert(error.message)}finally{checkbox.disabled=false}}));
document.getElementById('step-form').addEventListener('submit',async event=>{event.preventDefault();const input=document.getElementById('new-step'),content=input.value.trim();if(!content)return;input.disabled=true;try{const response=await fetch(`/${account}/cards/${number}/steps`,{method:'POST',headers:{Accept:'application/json','Content-Type':'application/json'},body:JSON.stringify({step:{content}})});if(!response.ok)throw Error('Could not add step');location.reload()}catch(error){input.disabled=false;alert(error.message)}});
document.getElementById('edit-form').addEventListener('submit',async event=>{event.preventDefault();const button=event.submitter;button.disabled=true;const error=document.getElementById('edit-error');error.textContent='';try{await mutation('','PATCH',{card:{title:document.getElementById('title').value,description:document.getElementById('description').value}});location.reload()}catch(ex){error.textContent=ex.message;button.disabled=false}});
const commentList=document.getElementById('comments');
async function applyCommentCreateStream(response){if(!response.ok)throw Error(`Could not post comment (${response.status})`);const streamPage=new DOMParser().parseFromString(await response.text(),'text/html');const streams=[...streamPage.querySelectorAll('turbo-stream')];if(streams.length!==2)throw Error('Comment creation updates missing');for(const stream of streams){const target=document.getElementById(stream.getAttribute('target')),content=stream.querySelector('template')?.content.firstElementChild;if(!target||!content)throw Error('Comment creation target missing');if(stream.getAttribute('action')==='before')target.before(document.importNode(content,true));else if(stream.getAttribute('action')==='update')target.replaceWith(document.importNode(content,true));else throw Error('Unexpected comment creation update')}}
commentList.addEventListener('submit',async event=>{const form=event.target;if(form.id!=='comment-form')return;event.preventDefault();const button=event.submitter,error=form.querySelector('#comment-error');if(button)button.disabled=true;error.textContent='';try{const response=await fetch(form.action,{method:'POST',headers:{Accept:'text/vnd.turbo-stream.html','Content-Type':'application/json'},body:JSON.stringify({comment:{body:form.querySelector('lexxy-editor').value}})});await applyCommentCreateStream(response)}catch(ex){error.textContent=ex.message;if(button)button.disabled=false}});
async function loadCommentFrame(url){const response=await fetch(url,{headers:{Accept:'text/html'}});if(!response.ok)throw Error(`Could not load comment (${response.status})`);const documentPage=new DOMParser().parseFromString(await response.text(),'text/html');const frame=documentPage.querySelector('turbo-frame[id^="container_comment_"]');if(!frame)throw Error('Comment frame missing');document.getElementById(frame.id)?.replaceWith(document.importNode(frame,true))}
async function applyCommentStream(response){if(!response.ok)throw Error(`Could not update comment (${response.status})`);const streamPage=new DOMParser().parseFromString(await response.text(),'text/html');const stream=streamPage.querySelector('turbo-stream');if(!stream)throw Error('Comment update missing');const target=document.getElementById(stream.getAttribute('target'));if(stream.getAttribute('action')==='remove'){target?.remove();return}const replacement=stream.querySelector('template')?.content.firstElementChild;if(!target||!replacement)throw Error('Comment update target missing');target.replaceWith(document.importNode(replacement,true))}
commentList.addEventListener('click',async event=>{const link=event.target.closest('a[data-comment-edit],a[data-comment-cancel]');if(!link||!commentList.contains(link))return;event.preventDefault();try{await loadCommentFrame(link.href)}catch(error){alert(error.message)}});
commentList.addEventListener('submit',async event=>{const form=event.target,editing=form.id.startsWith('edit_comment_'),deleting=form.id.startsWith('delete_comment_');if(!editing&&!deleting)return;event.preventDefault();if(deleting&&!confirm('Are you sure you want to delete this comment?'))return;const button=event.submitter;if(button)button.disabled=true;try{const response=await fetch(form.action,editing?{method:'PATCH',headers:{Accept:'text/vnd.turbo-stream.html','Content-Type':'application/json'},body:JSON.stringify({comment:{body:form.querySelector('lexxy-editor').value}})}:{method:'DELETE',headers:{Accept:'text/vnd.turbo-stream.html'}});await applyCommentStream(response)}catch(error){const message=form.closest('turbo-frame')?.querySelector('#comment_error');if(message)message.textContent=error.message;if(button)button.disabled=false}});
const utility=document.getElementById('utility-panel'),utilityTitle=document.getElementById('utility-title'),utilitySearch=document.getElementById('utility-search'),utilityContent=document.getElementById('utility-content');
function utilityList(items,empty){utilityContent.replaceChildren();if(!items.length){const message=document.createElement('p');message.textContent=empty;utilityContent.append(message);return}for(const item of items){const link=document.createElement('a');link.href=item.url;link.textContent=item.title;utilityContent.append(link)}}
async function loadUtility(kind,term=''){utilityContent.textContent='Loading…';try{const url=kind==='pins'?`/${account}/my/pins`:kind==='notifications'?`/${account}/notifications/tray`:`/${account}/search?q=${encodeURIComponent(term)}`;const response=await fetch(url,{headers:{Accept:'application/json'}});if(!response.ok)throw Error('Could not load');const data=await response.json(),rows=Array.isArray(data)?data:[];utilityList(rows.map(item=>kind==='notifications'?{url:item.card?.url||'#',title:item.card?.title||'Notification'}:{url:item.url,title:item.title}),kind==='pins'?'No pinned cards yet':kind==='notifications'?'No notifications':'No matching cards')}catch{utilityContent.textContent='Could not load items.'}}
document.querySelectorAll('[data-utility]').forEach(button=>button.addEventListener('click',()=>{const kind=button.dataset.utility;utilityTitle.textContent=kind==='pins'?'Pinned cards':kind==='notifications'?'Notifications':'Search cards';utilitySearch.hidden=kind!=='search';utilityContent.replaceChildren();utility.showModal();if(kind==='search'){utilitySearch.value='';utilitySearch.focus()}else loadUtility(kind)}));
utility.querySelector('.utility-close').addEventListener('click',()=>utility.close());utility.addEventListener('click',event=>{if(event.target===utility)utility.close()});let utilitySearchTimer;utilitySearch.addEventListener('input',()=>{clearTimeout(utilitySearchTimer);if(utilitySearch.value.trim())utilitySearchTimer=setTimeout(()=>loadUtility('search',utilitySearch.value.trim()),300);else utilityContent.replaceChildren()});
</script>
<script type="module">
import { DirectUpload } from '@rails/activestorage';
document.getElementById('image-upload')?.addEventListener('change',async event=>{const input=event.currentTarget,file=input.files?.[0];if(!file)return;input.disabled=true;try{const account=document.body.dataset.account,number=document.body.dataset.number;const blob=await new Promise((resolve,reject)=>new DirectUpload(file,`/${account}/rails/active_storage/direct_uploads`).create((error,blob)=>error?reject(error):resolve(blob)));const response=await fetch(`/${account}/cards/${number}`,{method:'PATCH',headers:{Accept:'application/json','Content-Type':'application/json'},body:JSON.stringify({card:{image:blob.signed_id}})});if(!response.ok)throw Error('Could not attach image');location.reload()}catch(error){input.disabled=false;alert(error.message||String(error))}});
</script>
