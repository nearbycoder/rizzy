<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{TITLE}} | Rizzy</title><style>{{EVENTS_CSS}}
.profile-main{max-width:920px;margin:0 auto;padding:28px 20px 70px}.profile-card{position:relative;margin:12px auto 30px;padding:28px;max-width:560px;text-align:center;border:1px solid #46433d;border-radius:16px;background:#292826}.profile-card__actions{position:absolute;top:18px;right:18px}.profile-avatar{display:block;width:112px;height:112px;object-fit:cover;border-radius:50%;margin:12px auto}.profile-card h1{margin:8px 0}.profile-email{margin-bottom:22px}.profile-email a{color:#e7bd61}.profile-form{display:grid;gap:16px;text-align:left}.profile-form label{display:grid;gap:6px;font-weight:700}.profile-form input{padding:10px 12px;border:1px solid #666158;border-radius:8px;background:#34322f;color:#f5f0e8}.profile-form input[readonly]{color:#afa89d}.profile-form__actions{display:flex;align-items:center;gap:14px}.profile-form__actions a{color:#e7bd61}.form-error{color:#ffae9d}
.profile-card #session_transfer_url{display:block;width:100%;margin:12px 0;padding:10px 12px;border:1px solid #666158;border-radius:8px;background:#34322f;color:#f5f0e8}.profile-card #copy-transfer{margin:0 8px 12px 0}.profile-card form[action$="/transfer_token"]{margin-top:12px}
.profile-card #show-transfer-qr{margin:0 8px 12px 0}#transfer-qr-dialog{max-width:min(90vw,440px);padding:24px;border:1px solid #666158;border-radius:14px;background:#292826;color:#f5f0e8;text-align:center}#transfer-qr-dialog::backdrop{background:#000a}#transfer-qr-dialog img{display:block;max-width:100%;height:auto;margin:18px auto;background:white}#transfer-qr-dialog form{margin:12px auto 0}
</style></head><body data-account="{{ACCOUNT}}"><a class="skip" href="#main">Skip to main content</a><header class="header"><a class="brand" href="/{{ACCOUNT}}/">Rizzy</a><a href="/{{ACCOUNT}}/">Activity</a></header><main class="profile-main" id="main">{{CONTENT}}</main><script>{{EVENTS_JS}}
document.getElementById('sign-out')?.addEventListener('click',async()=>{const response=await fetch('/session',{method:'DELETE',headers:{Accept:'application/json'}});if(response.ok)location.href='/session/new';else alert('Could not sign out')});
document.getElementById('copy-transfer')?.addEventListener('click',async event=>{const input=document.getElementById('session_transfer_url');try{await navigator.clipboard.writeText(input.value);event.currentTarget.textContent='Copied'}catch{input.select();document.execCommand('copy')}});
document.getElementById('show-transfer-qr')?.addEventListener('click',()=>document.getElementById('transfer-qr-dialog').showModal());
</script></body></html>
