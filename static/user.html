<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{TITLE}} | Rizzy</title><style>{{EVENTS_CSS}}
.profile-main{max-width:920px;margin:0 auto;padding:28px 20px 70px}.profile-card{position:relative;margin:12px auto 30px;padding:28px;max-width:560px;text-align:center;border:1px solid #46433d;border-radius:16px;background:#292826}.profile-card__actions{position:absolute;top:18px;right:18px}.profile-avatar{display:block;width:112px;height:112px;object-fit:cover;border-radius:50%;margin:12px auto}.profile-card h1{margin:8px 0}.profile-email{margin-bottom:22px}.profile-email a{color:#e7bd61}.profile-form{display:grid;gap:16px;text-align:left}.profile-form label{display:grid;gap:6px;font-weight:700}.profile-form input{padding:10px 12px;border:1px solid #666158;border-radius:8px;background:#34322f;color:#f5f0e8}.profile-form input[readonly]{color:#afa89d}.profile-form__actions{display:flex;align-items:center;gap:14px}.profile-form__actions a{color:#e7bd61}.form-error{color:#ffae9d}
.profile-card #session_transfer_url{display:block;width:100%;margin:12px 0;padding:10px 12px;border:1px solid #666158;border-radius:8px;background:#34322f;color:#f5f0e8}.profile-card #copy-transfer{margin:0 8px 12px 0}.profile-card form[action$="/transfer_token"]{margin-top:12px}
.profile-card #show-transfer-qr{margin:0 8px 12px 0}#transfer-qr-dialog{max-width:min(90vw,440px);padding:24px;border:1px solid #666158;border-radius:14px;background:#292826;color:#f5f0e8;text-align:center}#transfer-qr-dialog::backdrop{background:#000a}#transfer-qr-dialog img{display:block;max-width:100%;height:auto;margin:18px auto;background:white}#transfer-qr-dialog form{margin:12px auto 0}
.profile-avatar-controls{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:4px}.profile-avatar-upload{display:flex!important;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:#e7bd61}.profile-avatar-upload .profile-avatar{margin:0}.profile-avatar-upload input[type=file]{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}.profile-avatar-upload:focus-within .profile-avatar{outline:3px solid #e7bd61;outline-offset:4px}.profile-avatar-controls button{font-size:.85rem}
.settings--profile{display:grid;gap:24px;max-width:640px;margin:auto}.settings__panel.profile-card{margin:0;max-width:none}.profile-card--sections{padding:0;text-align:center}.settings__section{padding:24px 28px;border-top:1px solid #46433d}.settings__section:first-child{border-top:0}.settings__section h2{margin:0 0 10px;font-size:1.1rem}.settings__section p{margin:0 0 14px}.profile-card__links{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 16px;margin:14px 0 18px}.profile-card__links a,.settings__section a{color:#e7bd61}.profile-card__session{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px}.profile-card__session:empty{display:none}.profile-card__session>a{text-decoration:none;color:#e7bd61}.profile-card__session form{margin:0}.theme-switcher{display:flex;gap:10px;justify-content:center;margin-top:14px}.theme-switcher__btn{display:flex;flex:1;flex-direction:column;align-items:center;gap:8px;padding:14px 10px;border-radius:8px;background:#34322f;cursor:pointer}.theme-switcher__btn:has(input:checked){outline:2px solid #e7bd61}.theme-switcher__btn input{accent-color:#e7bd61}.settings__section details{margin-top:12px}.settings__section summary{display:inline-block;padding:8px 14px;border-radius:20px;background:#80b7fc;color:#0c1a22;cursor:pointer}.settings__section details[open] summary{margin-bottom:14px}.settings__section form{margin:12px auto 0}
html[data-theme="light"]{color:#20252a;background:#f8f5ed;--color-canvas:#f8f5ed;--color-ink:#20252a;--color-ink-lighter:#d7d1c6}html[data-theme="light"] .profile-card{background:#fff;border-color:#ded8cb}html[data-theme="light"] .settings__section{border-color:#ded8cb}html[data-theme="light"] .theme-switcher__btn{background:#f1ede5}html[data-theme="light"] .profile-form input,html[data-theme="light"] .profile-card #session_transfer_url{background:#fff;color:#20252a;border-color:#b9b0a1}@media(max-width:479px){.theme-switcher{flex-direction:column}}
</style></head><body data-account="{{ACCOUNT}}"><a class="skip" href="#main">Skip to main content</a><header class="header"><a class="brand" href="/{{ACCOUNT}}/">Rizzy</a><a href="/{{ACCOUNT}}/">Activity</a></header><main class="profile-main" id="main">{{CONTENT}}</main>{{FOOTER}}<script>{{EVENTS_JS}}
const userEventsFrame=document.querySelector('turbo-frame#user_events[src]');if(userEventsFrame){fetch(userEventsFrame.getAttribute('src'),{headers:{Accept:'text/html'}}).then(async response=>{if(!response.ok)throw Error('Activity unavailable');const page=new DOMParser().parseFromString(await response.text(),'text/html');const loaded=page.querySelector('turbo-frame#user_events');if(!loaded)throw Error('Activity frame unavailable');userEventsFrame.replaceWith(loaded);activateActivity(loaded.querySelector('#activity'))}).catch(()=>{const link=document.createElement('a');link.href=userEventsFrame.getAttribute('src');link.textContent='Open activity';userEventsFrame.append(link)})}
const themeButtons=document.querySelectorAll('input[name="theme"]');if(themeButtons.length){const applyTheme=theme=>{localStorage.setItem('theme',theme);if(theme==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',theme);themeButtons.forEach(button=>button.checked=button.value===theme)};applyTheme(localStorage.getItem('theme')||'auto');themeButtons.forEach(button=>button.addEventListener('change',()=>applyTheme(button.value)))}
document.getElementById('sign-out-form')?.addEventListener('submit',async event=>{event.preventDefault();const response=await fetch('/session',{method:'DELETE',headers:{Accept:'application/json'}});if(response.ok)location.href='/session/new';else alert('Could not sign out')});
document.getElementById('copy-transfer')?.addEventListener('click',async event=>{const input=document.getElementById('session_transfer_url');try{await navigator.clipboard.writeText(input.value);event.currentTarget.textContent='Copied'}catch{input.select();document.execCommand('copy')}});
document.getElementById('show-transfer-qr')?.addEventListener('click',()=>document.getElementById('transfer-qr-dialog').showModal());
</script></body></html>
