<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join {{ACCOUNT_NAME}} in Rizzy</title>
<style>:root{font:16px/1.5 system-ui,sans-serif;background:#f7f5f0;color:#252322}*{box-sizing:border-box}body{margin:0}header{padding:16px max(20px,4vw);font-size:24px;font-weight:800;letter-spacing:-.04em}main{max-width:540px;margin:11vh auto;padding:26px;background:#fff;border:1px solid #ddd7cf;border-radius:16px;text-align:center}h1{font-size:clamp(28px,4vw,38px);line-height:1.2;margin:0 0 22px}form{display:grid;gap:15px}input,button{font:inherit}input{width:100%;padding:12px;border:1px solid #aaa39a;border-radius:8px}button{width:100%;padding:12px;border:0;border-radius:8px;background:#252322;color:white;cursor:pointer;font-weight:700}</style></head>
<body><header>Rizzy</header><main><h1>Join {{ACCOUNT_NAME}} in Rizzy</h1><form method="post" action="/{{ACCOUNT}}/join/{{CODE}}"><input type="email" name="email_address" placeholder="Email address" aria-label="Email address" autocomplete="username" required autofocus><button id="log_in" type="submit">Continue →</button></form></main></body></html>
