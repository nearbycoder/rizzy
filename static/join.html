<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Join {{ACCOUNT_NAME}} in Rizzy</title>
<style>
  :root{font:16px/1.45 system-ui,sans-serif;color:#252322;background:#f7f5f0}*{box-sizing:border-box}body{margin:0}header{background:#efecdf;border-bottom:1px solid #d6d1c8;padding:13px max(16px,4vw);font-size:23px;font-weight:700;letter-spacing:-1px}main{max-width:560px;margin:12vh auto;background:white;border:1px solid #ddd7cf;border-radius:15px;padding:30px}h1{line-height:1.2;letter-spacing:-.04em}input,button{font:inherit}input{display:block;width:100%;border:1px solid #d6d1c8;border-radius:8px;padding:9px;margin:6px 0 14px}button{cursor:pointer;border:0;border-radius:9px;background:#24221f;color:white;padding:9px 14px}button:hover{background:#48443e}.error{color:#b52625}.muted{color:#756f67}[hidden]{display:none!important}
</style>
<header>Rizzy</header>
<main>
  <h1>Join {{ACCOUNT_NAME}} in Rizzy</h1>
  <p class="muted" id="instructions">Enter your email address to join this account.</p>
  <p id="error" class="error" role="alert" hidden></p>
  <form id="email-form"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required><button>Continue</button></form>
  <form id="code-form" hidden><label for="code">Six-character code</label><input id="code" autocomplete="one-time-code" minlength="6" maxlength="6" required><button>Sign in</button></form>
  <form id="name-form" hidden><label for="name">Full name</label><input id="name" autocomplete="name" required><button>Join account</button></form>
</main>
<script>
const account=location.pathname.split('/')[1],invitePath=location.pathname;
const emailForm=document.querySelector('#email-form'),codeForm=document.querySelector('#code-form'),nameForm=document.querySelector('#name-form');
let email='';
function showError(message){const el=document.querySelector('#error');el.textContent=message;el.hidden=false}
async function send(path,body){const r=await fetch(path,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(body)});if(!r.ok){let data={};try{data=await r.json()}catch{}throw Error(data.message||r.statusText)}return r}
async function finish(){const r=await fetch('/my/identity',{credentials:'same-origin',headers:{Accept:'application/json'}});if(!r.ok)throw Error('Sign in again to finish joining');const identity=await r.json();const joined=identity.accounts.find(a=>a.slug==='/'+account);if(!joined)throw Error('Account access is not ready yet');if(joined.user.name===email){emailForm.hidden=true;codeForm.hidden=true;nameForm.hidden=false;document.querySelector('#instructions').textContent='Add your name to finish joining.'}else{localStorage.setItem('rizzyAccount',account);location.assign('/')}}
emailForm.onsubmit=async event=>{event.preventDefault();email=document.querySelector('#email').value.trim().toLowerCase();try{const r=await send(invitePath,{email_address:email});const data=await r.json();if(data.pending_authentication_token){emailForm.hidden=true;codeForm.hidden=false;const devCode=r.headers.get('X-Magic-Link-Code');document.querySelector('#instructions').textContent=devCode?'Development code: '+devCode:'Check your email for a sign-in code.'}else await finish()}catch(error){showError(error.message)}};
codeForm.onsubmit=async event=>{event.preventDefault();try{await send('/session/magic_link',{code:document.querySelector('#code').value});await finish()}catch(error){showError(error.message)}};
nameForm.onsubmit=async event=>{event.preventDefault();try{await send('/'+account+'/users/joins',{user:{name:document.querySelector('#name').value}});localStorage.setItem('rizzyAccount',account);location.assign('/')}catch(error){showError(error.message)}};
</script>
</html>
