<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rizzy</title>
<style>
  :root{font:16px/1.45 system-ui,sans-serif;color:#252322;background:#f7f5f0}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;background:#24221f;color:white;padding:8px 12px}button:hover{background:#48443e}input,textarea{border:1px solid #d6d1c8;border-radius:8px;padding:9px;background:white}header{background:#efecdf;border-bottom:1px solid #d6d1c8;padding:13px max(16px,4vw);display:flex;align-items:center;gap:16px}header strong{font-size:23px;letter-spacing:-1px}header span{color:#6c665e}main{padding:25px max(16px,4vw)}.login{max-width:560px;margin:12vh auto;background:white;border:1px solid #ddd7cf;border-radius:15px;padding:30px}.login input{width:100%;margin:5px 0 13px}.login form button{width:100%;margin-top:8px}.text-button{border:0;background:none;color:#514733;padding:4px;text-decoration:underline}.text-button:hover{background:none;color:#24221f}h1,h2{line-height:1.2;letter-spacing:-.04em}.top{display:flex;align-items:center;justify-content:space-between;gap:16px}.boards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.boardlink{background:white;border:1px solid #dfdbd4;border-radius:13px;padding:20px;cursor:pointer;font-size:19px;font-weight:700}.boardlink:hover,.card:hover{border-color:#a89d8b}.columns{display:flex;align-items:flex-start;gap:14px;overflow:auto;padding:15px 0 40px}.column{flex:0 0 295px;background:#ece9e2;border-radius:14px;padding:14px}.column h2{font-size:17px;margin:0 0 12px}.card{background:white;border:1px solid #e1ddd6;border-radius:11px;padding:13px;margin:9px 0;cursor:pointer;box-shadow:0 2px 3px #00000008}.card small{display:block;color:#80786e;margin-top:8px}.form{display:flex;gap:7px;margin-top:12px}.form input{min-width:0;flex:1}dialog{border:0;border-radius:16px;box-shadow:0 15px 60px #0004;width:min(600px,95vw)}dialog::backdrop{background:#0006}dialog textarea{display:block;width:100%;min-height:130px;margin:10px 0}.muted{color:#756f67}.error{color:#b52625}
</style>
<header><strong>Rizzy</strong><span>Ideas in motion</span><button id="logout" style="margin-left:auto;display:none">Disconnect</button></header>
<main id="app"></main>
<dialog id="detail"><button style="float:right" onclick="document.querySelector('#detail').close()">Close</button><div id="detail-body"></div></dialog>
<script>
const app=document.querySelector('#app'); const dlg=document.querySelector('#detail');
let slug=localStorage.getItem('rizzyAccount')||'';let token=localStorage.getItem('rizzyToken')||'';
let currentBoard=null;
function node(tag,attrs={},children=[]){const el=document.createElement(tag);for(const [k,v] of Object.entries(attrs)){if(k==='text')el.textContent=v;else if(k==='onclick')el.addEventListener('click',v);else el.setAttribute(k,v)}for(const c of children)el.append(c);return el}
async function request(path,method='GET',body){const headers={'Content-Type':'application/json',Accept:'application/json'};if(token)headers.Authorization='Bearer '+token;const r=await fetch(path,{method,headers,credentials:'same-origin',body:body?JSON.stringify(body):undefined});if(!r.ok){let d={};try{d=await r.json()}catch{}throw Error(d.message||r.statusText)}return r}
async function api(path,method='GET',body){const r=await request('/'+slug+path,method,body);return r.status===204?null:r.json()}
function error(e){app.prepend(node('p',{class:'error',text:e.message}))}
async function allPages(path){let out=[];for(let page=1;;page++){const rows=await api(path+(path.includes('?')?'&':'?')+'page='+page);out.push(...rows);if(rows.length<[15,30,50,100][Math.min(page-1,3)])return out}}
function login(){document.querySelector('#logout').style.display='none';app.replaceChildren(node('section',{class:'login'},[node('h1',{text:'Sign in to Rizzy'}),node('p',{class:'muted',text:'We will send a six-character sign-in code to your email.'}),node('form',{},[node('label',{text:'Email address'}),node('input',{name:'email',type:'email',autocomplete:'email',required:''}),node('button',{text:'Send code',type:'submit'})]),node('p',{},[node('button',{class:'text-button',text:'Use an API token',onclick:tokenLogin})])]));app.querySelector('form').onsubmit=async e=>{e.preventDefault();const email=new FormData(e.target).get('email');try{const r=await request('/session','POST',{email_address:email});codeLogin(email,r.headers.get('X-Magic-Link-Code'))}catch(x){error(x)}}}
function codeLogin(email,devCode){app.replaceChildren(node('section',{class:'login'},[node('h1',{text:'Check your email'}),node('p',{class:'muted',text:'Enter the code sent to '+email+'.'}),...(devCode?[node('p',{text:'Development code: '+devCode})]:[]),node('form',{},[node('label',{text:'Six-character code'}),node('input',{name:'code',autocomplete:'one-time-code',minlength:'6',maxlength:'6',required:''}),node('button',{text:'Sign in',type:'submit'})]),node('button',{class:'text-button',text:'Use a different email',onclick:login})]));app.querySelector('form').onsubmit=async e=>{e.preventDefault();try{const r=await request('/session/magic_link','POST',{code:new FormData(e.target).get('code')});const result=await r.json();token='';localStorage.removeItem('rizzyToken');if(result.requires_signup_completion)signup();else signedIn()}catch(x){error(x)}}}
function signup(){app.replaceChildren(node('section',{class:'login'},[node('h1',{text:'Welcome to Rizzy'}),node('p',{class:'muted',text:'Add your name to create your account.'}),node('form',{},[node('label',{text:'Full name'}),node('input',{name:'name',autocomplete:'name',required:''}),node('button',{text:'Create account',type:'submit'})])]));app.querySelector('form').onsubmit=async e=>{e.preventDefault();try{await request('/signup/completion','POST',{signup:{full_name:new FormData(e.target).get('name')}});signedIn()}catch(x){error(x)}}}
function tokenLogin(){app.replaceChildren(node('section',{class:'login'},[node('h1',{text:'Connect with API token'}),node('form',{},[node('label',{text:'Account number'}),node('input',{name:'account',value:slug,required:''}),node('label',{text:'Bearer token'}),node('input',{name:'token',required:'',type:'password'}),node('button',{text:'Open boards',type:'submit'})]),node('button',{class:'text-button',text:'Sign in with email',onclick:login})]));app.querySelector('form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);slug=f.get('account');token=f.get('token');try{await api('/boards');localStorage.setItem('rizzyAccount',slug);localStorage.setItem('rizzyToken',token);boards()}catch(x){error(x)}}}
async function signedIn(){try{const identity=await(await request('/my/identity')).json();if(!identity.accounts.length){signup();return}const chosen=identity.accounts.find(a=>a.slug.slice(1)===slug);if(identity.accounts.length>1&&!chosen){app.replaceChildren(node('section',{class:'login'},[node('h1',{text:'Choose an account'}),...identity.accounts.map(a=>node('button',{text:a.name,onclick:()=>{slug=a.slug.slice(1);localStorage.setItem('rizzyAccount',slug);boards()}}))]));return}slug=(chosen||identity.accounts[0]).slug.slice(1);localStorage.setItem('rizzyAccount',slug);boards()}catch(e){login()}}
async function boards(){try{const data=await allPages('/boards');document.querySelector('#logout').style.display='block';app.replaceChildren(node('div',{class:'top'},[node('h1',{text:'Boards'}),node('button',{text:'New board',onclick:async()=>{const name=prompt('Board name');if(name){try{await api('/boards','POST',{board:{name}});boards()}catch(e){error(e)}}}})]),node('div',{class:'boards'},data.map(b=>node('div',{class:'boardlink',text:b.name,onclick:()=>openBoard(b)}))))}catch(e){login();error(e)}}
async function openBoard(b){currentBoard=b;try{const [columns,mine]=await Promise.all([api('/boards/'+b.id+'/columns'),allPages('/cards?board_ids%5B%5D='+encodeURIComponent(b.id))]);const groups=[{id:null,name:'Maybe?',color:'var(--color-card-default)'},...columns,{id:'done',name:'Done'}];app.replaceChildren(node('div',{class:'top'},[node('h1',{text:b.name}),node('button',{text:'All boards',onclick:boards})]),node('div',{class:'columns'},groups.map(col=>{const list=mine.filter(c=>col.id==='done'?c.closed:col.id===null?!c.column&&!c.closed&&!c.postponed:c.column?.id===col.id&&!c.closed);const box=node('section',{class:'column'},[node('h2',{text:col.name+'  '+list.length}),...list.map(c=>node('div',{class:'card',onclick:()=>showCard(c)},[node('strong',{text:c.title}),node('small',{text:'#'+c.number})]))]);if(col.id===null)box.append(node('form',{class:'form'},[node('input',{name:'title',placeholder:'New card title',required:''}),node('button',{text:'Add',type:'submit'})]));if(col.id===null)box.querySelector('form').onsubmit=async e=>{e.preventDefault();const title=new FormData(e.target).get('title');try{await api('/boards/'+b.id+'/cards','POST',{card:{title}});openBoard(b)}catch(x){error(x)}};return box})),node('button',{text:'Add column',onclick:async()=>{const name=prompt('Column name');if(name){try{await api('/boards/'+b.id+'/columns','POST',{column:{name}});openBoard(b)}catch(e){error(e)}}}}))}catch(e){error(e)}}
async function showCard(card){try{const c=await api('/cards/'+card.number);const body=document.querySelector('#detail-body');body.replaceChildren(node('h1',{text:c.title}),node('p',{class:'muted',text:'#'+c.number+' · '+c.board.name}),node('p',{text:c.description||'No description yet'}),node('textarea',{placeholder:'Description'}),node('button',{text:'Save description',onclick:async()=>{try{await api('/cards/'+c.number,'PUT',{card:{description:body.querySelector('textarea').value}});dlg.close();openBoard(currentBoard)}catch(e){alert(e.message)}}}),node('button',{text:c.closed?'Reopen':'Mark done',onclick:async()=>{try{await api('/cards/'+c.number+'/closure',c.closed?'DELETE':'POST');dlg.close();openBoard(currentBoard)}catch(e){alert(e.message)}}}));body.querySelector('textarea').value=c.description;dlg.showModal()}catch(e){error(e)}}
document.querySelector('#logout').onclick=async()=>{try{await request('/session','DELETE')}catch{}localStorage.removeItem('rizzyToken');token='';login()};signedIn();
</script>
</html>
