.card:hover,.card:focus-visible { border-color: #e7bd61; outline: none }
.card--golden { border-color: #b58b39 }
.card__number { color: #cbbf9e; font-size: 12px }

.card__meta { display: block; margin-top: 14px; color: #afa89d; font-size: 12px }
.cards__empty { margin: 5px 0; color: #afa89d; font-size: 14px }
.cards__more { display: block; margin-top: 15px; color: #e7bd61; font-size: 14px }
.board-tools { display: grid; gap: 8px; margin-top: 16px }
.board-tools form { margin: 0 }
.board-tools button { width: 100% }
.board-filter { display: flex; align-items: end; flex-wrap: wrap; gap: 12px; margin-top: 18px }
.board-filter label { display: grid; gap: 4px; font-size: 13px; color: #d6c9b5 }
.board-filter input,.board-filter select { min-height: 41px; padding: 8px 10px; border: 1px solid #666158; border-radius: 8px; background: #34322f; color: #f5f0e8; font: inherit }
.board-filter a { padding: 8px; color: #e7bd61 }
.card-columns--filtered .cards { flex: 1 1 auto }
.cards--grid .cards__list { grid-template-columns: repeat(auto-fill,minmax(220px,1fr)) }

<script>
document.addEventListener('click',event=>{const link=event.target.closest('a[href]');if(!link)return;const destination=new URL(link.href);if(destination.origin!==location.origin||!new RegExp(`^/${document.body.dataset.account}/cards/\\d+$`).test(destination.pathname))return;sessionStorage.setItem('rizzy-card-referrer',JSON.stringify({url:location.href,label:document.title.replace(/ \| Rizzy$/,'')}))});
function relativeDates(){const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());for(const time of document.querySelectorAll('time[data-relative-date]')){const date=new Date(time.dateTime);if(Number.isNaN(date.getTime()))continue;const day=new Date(date.getFullYear(),date.getMonth(),date.getDate());const days=Math.round((today-day)/86400000);time.textContent=days===0?'today':days===1?'yesterday':days>1&&days<7?`${days} days ago`:date.toLocaleDateString(undefined,{month:'short',day:'numeric'});time.removeAttribute('data-relative-date')}}
relativeDates();
const boardColumns=document.querySelector('.card-columns');
const boardSections=[...boardColumns.querySelectorAll(':scope > .cards')];
const expandedColumnKey=`rizzy-expanded-column:${document.body.dataset.board}`;
const desktopColumns=()=>window.matchMedia('(min-width: 640px)').matches;
function markColumn(column,expanded){column.classList.toggle('is-expanded',expanded);column.classList.toggle('is-collapsed',!expanded);column.querySelector('.cards__toggle')?.setAttribute('aria-expanded',String(expanded))}
function expandColumn(column,persist=true){
  for(const item of boardSections){
    if(item===column||item.id==='maybe'&&desktopColumns())markColumn(item,true);
    else markColumn(item,false);
  }
  column.querySelector('.cards__more[data-page="1"]')?.click();
  if(persist){if(column.id==='maybe')localStorage.removeItem(expandedColumnKey);else localStorage.setItem(expandedColumnKey,column.id)}
}
function toggleColumn(column){
  if(column.id==='maybe'&&desktopColumns())return;
  if(column.classList.contains('is-expanded')){
    markColumn(column,false);
    if(localStorage.getItem(expandedColumnKey)===column.id)localStorage.removeItem(expandedColumnKey);
  }else expandColumn(column);
}
boardSections.forEach(column=>column.querySelector('.cards__toggle')?.addEventListener('click',()=>toggleColumn(column)));
document.querySelector('.board-tools__watch-toggle')?.addEventListener('click',async event=>{const button=event.currentTarget;button.disabled=true;try{const response=await fetch(`/${document.body.dataset.account}/boards/${document.body.dataset.board}/involvement`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({involvement:button.dataset.involvement})});if(!response.ok)throw Error('Could not update watching');location.reload()}catch(error){button.disabled=false;alert(error.message)}});
const utility=document.getElementById('utility-panel'),utilityTitle=document.getElementById('utility-title'),utilitySearch=document.getElementById('utility-search'),utilityContent=document.getElementById('utility-content');
function utilityList(items,empty){utilityContent.replaceChildren();if(!items.length){const message=document.createElement('p');message.textContent=empty;utilityContent.append(message);return}for(const item of items){const link=document.createElement('a');link.href=item.url;link.textContent=item.title;utilityContent.append(link)}}
async function loadUtility(kind,term=''){utilityContent.textContent='Loading…';try{const account=document.body.dataset.account,url=kind==='pins'?`/${account}/my/pins`:kind==='notifications'?`/${account}/notifications/tray`:`/${account}/search?q=${encodeURIComponent(term)}`;const response=await fetch(url,{headers:{Accept:'application/json'}});if(!response.ok)throw Error('Could not load');const data=await response.json(),rows=Array.isArray(data)?data:[];utilityList(rows.map(item=>kind==='notifications'?{url:item.card?.url||'#',title:item.card?.title||'Notification'}:{url:item.url,title:item.title}),kind==='pins'?'No pinned cards yet':kind==='notifications'?'No notifications':'No matching cards')}catch{utilityContent.textContent='Could not load items.'}}
document.querySelectorAll('[data-utility]').forEach(button=>button.addEventListener('click',()=>{const kind=button.dataset.utility;utilityTitle.textContent=kind==='pins'?'Pinned cards':kind==='notifications'?'Notifications':'Search cards';utilitySearch.hidden=kind!=='search';utilityContent.replaceChildren();utility.showModal();if(kind==='search'){utilitySearch.value='';utilitySearch.focus()}else loadUtility(kind)}));
utility.querySelector('.utility-close').addEventListener('click',()=>utility.close());utility.addEventListener('click',event=>{if(event.target===utility)utility.close()});let utilitySearchTimer;utilitySearch.addEventListener('input',()=>{clearTimeout(utilitySearchTimer);if(utilitySearch.value.trim())utilitySearchTimer=setTimeout(()=>loadUtility('search',utilitySearch.value.trim()),300);else utilityContent.replaceChildren()});
const filterForm=document.querySelector('.board-filter');let filterTimer;filterForm?.querySelector('input[type=search]')?.addEventListener('input',()=>{clearTimeout(filterTimer);filterTimer=setTimeout(()=>filterForm.requestSubmit(),400)});filterForm?.addEventListener('change',event=>{const field=event.target;if(field.matches('input[name="assignment_status"]')&&field.checked)filterForm.querySelectorAll('input[name="assignee_ids[]"]').forEach(input=>input.checked=false);else if(field.matches('input[name="assignee_ids[]"]')&&field.checked)filterForm.querySelector('input[name="assignment_status"]').checked=false;if(field.matches('select,input[type=checkbox]'))filterForm.requestSubmit()});
const newColumnDialog=document.getElementById('new-column-dialog');
document.getElementById('add-column')?.addEventListener('click',()=>{newColumnDialog.showModal();newColumnDialog.querySelector('input[name=name]').focus()});
document.querySelectorAll('.column-dialog [data-close-dialog]').forEach(button=>button.addEventListener('click',()=>button.closest('dialog').close()));
const namedColumns=()=>[...boardColumns.querySelectorAll(':scope > .cards--doing[data-column-id]')];
function updateMoveButtons(){const columns=namedColumns();columns.forEach((column,index)=>{column.querySelector('[data-column-action=left]').disabled=index===0;column.querySelector('[data-column-action=right]').disabled=index===columns.length-1})}
function closeColumnMenus(){boardColumns.querySelectorAll('.cards__menu-panel').forEach(panel=>{panel.hidden=true;panel.previousElementSibling.setAttribute('aria-expanded','false')})}
updateMoveButtons();
boardColumns.addEventListener('click',async event=>{
  const trigger=event.target.closest('.cards__menu-trigger');
  if(trigger){const panel=trigger.nextElementSibling,opening=panel.hidden;closeColumnMenus();panel.hidden=!opening;trigger.setAttribute('aria-expanded',String(opening));return}
  const action=event.target.closest('[data-column-action]');
  if(!action||action.disabled)return;
  const column=action.closest('.cards'),id=column.dataset.columnId,kind=action.dataset.columnAction;
  closeColumnMenus();
  if(kind==='edit'){const dialog=column.querySelector('.column-dialog');dialog.showModal();dialog.querySelector('input[name=name]').focus();return}
  if(kind==='delete'&&!confirm('Are you sure you want to delete this column? This will move the cards back to Maybe.'))return;
  action.disabled=true;
  try{
    const account=document.body.dataset.account,board=document.body.dataset.board;
    const path=kind==='delete'?`/${account}/boards/${board}/columns/${id}.json`:`/${account}/columns/${id}/${kind}_position.json`;
    const response=await fetch(path,{method:kind==='delete'?'DELETE':'POST',headers:{Accept:'application/json'}});
    if(!response.ok)throw Error(`Could not ${kind==='delete'?'delete':'move'} column`);
    if(kind==='delete'){if(localStorage.getItem(expandedColumnKey)===column.id)localStorage.removeItem(expandedColumnKey);location.reload();return}
    const columns=namedColumns(),index=columns.indexOf(column),neighbor=columns[index+(kind==='left'?-1:1)];
    if(neighbor){if(kind==='left')boardColumns.insertBefore(column,neighbor);else neighbor.after(column)}
    updateMoveButtons();
  }catch(error){action.disabled=false;alert(error.message)}
});
document.addEventListener('click',event=>{if(!event.target.closest('.cards__menu'))closeColumnMenus()});
document.addEventListener('keydown',event=>{if(event.key==='Escape')closeColumnMenus()});
document.querySelectorAll('[data-column-form]').forEach(form=>form.addEventListener('submit',async event=>{
  event.preventDefault();
  const nameInput=form.querySelector('input[name=name]'),name=nameInput.value.trim(),color=form.querySelector('input[name=color]:checked').value;
  if(!name){nameInput.focus();return}
  const button=form.querySelector('[type=submit]');button.disabled=true;
  try{
    const account=document.body.dataset.account,board=document.body.dataset.board,isNew=form.dataset.columnForm==='new';
    const id=isNew?'':form.closest('.cards').dataset.columnId;
    const path=isNew?`/${account}/boards/${board}/columns.json`:`/${account}/boards/${board}/columns/${id}.json`;
    const response=await fetch(path,{method:isNew?'POST':'PATCH',headers:{Accept:'application/json','Content-Type':'application/json'},body:JSON.stringify({column:{name,color}})});
    if(!response.ok)throw Error(`Could not ${isNew?'add':'update'} column`);
    location.reload();
  }catch(error){button.disabled=false;alert(error.message)}
}));
document.querySelectorAll('.cards__more').forEach(button=>button.addEventListener('click',async()=>{
  button.disabled=true;
  const page=Number(button.dataset.page);
  try {
    const response=await fetch(`${button.dataset.path}?page=${page}`,{headers:{Accept:'text/html','X-Rizzy-Card-Fragment':'1'}});
    if(!response.ok)throw Error('Could not load cards');
    const markup=await response.text(),column=button.closest('.cards'),list=column.querySelector('.cards__list');
    list.querySelector('[data-loading]')?.remove();
    const fragment=document.createRange().createContextualFragment(markup),loaded=fragment.querySelectorAll('article.card').length;
    list.append(fragment);relativeDates();
    if(list.querySelectorAll('.card').length>=Number(column.dataset.count)||loaded<[15,30,50,100][Math.min(page-1,3)])button.remove();else{button.dataset.page=String(page+1);button.textContent='Load more';button.disabled=false}
  }catch(error){button.disabled=false;alert(error.message)}
}));
const savedExpandedColumn=boardSections.find(column=>column.id===localStorage.getItem(expandedColumnKey));
if(savedExpandedColumn)expandColumn(savedExpandedColumn,false);
const selectedCardKey='rizzy-card-selected';
function visibleCards(column){return [...column.querySelectorAll('.cards__list .card[data-card-number]')].filter(card=>card.checkVisibility())}
function selectCard(card){
  const column=card.closest('.cards');
  column.querySelectorAll('.card[aria-selected]').forEach(item=>item.removeAttribute('aria-selected'));
  card.setAttribute('aria-selected','true');
  card.focus({preventScroll:true});
  card.scrollIntoView({block:'nearest',inline:'nearest'});
  sessionStorage.setItem(selectedCardKey,JSON.stringify({url:location.href,number:card.dataset.cardNumber}));
}
function focusFirstCard(column){
  const first=visibleCards(column)[0];
  if(first){selectCard(first);return}
  const observer=new MutationObserver(()=>{
    if(document.activeElement!==column){observer.disconnect();return}
    const loaded=visibleCards(column)[0];
    if(loaded){observer.disconnect();selectCard(loaded)}
  });
  observer.observe(column.querySelector('.cards__list'),{childList:true});
  setTimeout(()=>observer.disconnect(),5000);
}
boardColumns.addEventListener('focusin',event=>{
  const column=event.target.closest('.cards');
  if(!column)return;
  if(event.target===column){
    if(column.classList.contains('is-collapsed'))expandColumn(column);
    focusFirstCard(column);
  }else if(event.target.matches('.card[data-card-number]'))selectCard(event.target);
});
boardColumns.addEventListener('click',event=>{
  const link=event.target.closest('.card__link,a.card[href]');
  const card=link?.closest('.card[data-card-number]');
  if(card)selectCard(card);
});
boardColumns.addEventListener('keydown',event=>{
  const card=event.target.closest('.card[data-card-number]');
  if(!card||event.altKey||event.ctrlKey||event.metaKey)return;
  if(event.key==='Enter'&&event.target===card){event.preventDefault();card.querySelector('.card__link')?.click();return}
  if(!['ArrowDown','ArrowUp'].includes(event.key)||event.target!==card)return;
  const cards=visibleCards(card.closest('.cards')),index=cards.indexOf(card),next=cards[index+(event.key==='ArrowDown'?1:-1)];
  if(next){event.preventDefault();selectCard(next)}
});
let cardReturn;
try{cardReturn=JSON.parse(sessionStorage.getItem('rizzy-card-return')||'null')}catch{}
sessionStorage.removeItem('rizzy-card-return');
if(cardReturn?.url===location.href&&cardReturn.expiresAt>Date.now()){
  const restore=()=>{
    const card=[...boardColumns.querySelectorAll('.cards.is-expanded .card[data-card-number],.cards--grid .card[data-card-number]')].find(item=>item.dataset.cardNumber===String(cardReturn.number)&&item.checkVisibility());
    if(card){selectCard(card);return true}
    return false;
  };
  if(!restore()){
    const observer=new MutationObserver(()=>{if(restore())observer.disconnect()});
    observer.observe(boardColumns,{subtree:true,childList:true});
    setTimeout(()=>observer.disconnect(),5000);
  }
}
const lazyColumns=new IntersectionObserver(entries=>{for(const entry of entries)if(entry.isIntersecting){lazyColumns.unobserve(entry.target);entry.target.click()}});
document.querySelectorAll('.cards__more[data-page="1"]').forEach(button=>lazyColumns.observe(button));
let draggedCard=null;
boardColumns?.addEventListener('dragstart',event=>{
  const card=event.target.closest('.card[data-card-number]');if(!card)return;
  draggedCard=card.dataset.cardNumber;event.dataTransfer.effectAllowed='move';event.dataTransfer.setData('text/plain',draggedCard);
});
boardColumns?.addEventListener('dragover',event=>{
  if(!draggedCard)return;
  const column=event.target.closest('.cards[data-column-id]');if(!column)return;
  event.preventDefault();event.dataTransfer.dropEffect='move';
  boardColumns.querySelectorAll('.cards--drop-target').forEach(item=>item.classList.remove('cards--drop-target'));
  column.classList.add('cards--drop-target');
});
boardColumns?.addEventListener('dragend',()=>{draggedCard=null;boardColumns.querySelectorAll('.cards--drop-target').forEach(item=>item.classList.remove('cards--drop-target'))});
boardColumns?.addEventListener('drop',async event=>{
  if(!draggedCard)return;
  const column=event.target.closest('.cards[data-column-id]');if(!column)return;
  event.preventDefault();
  const account=document.body.dataset.account,id=column.dataset.columnId,card=draggedCard;
  const destination=id==='done'?'closure':id==='not-now'?'not_now':id==='maybe'?'stream':'column';
  const suffix=destination==='column'?`?column_id=${encodeURIComponent(id)}`:'';
  draggedCard=null;column.classList.remove('cards--drop-target');
  try {
    const response=await fetch(`/${account}/columns/cards/${card}/drops/${destination}${suffix}`,{method:'POST',headers:{Accept:'text/vnd.turbo-stream.html'}});
    if(!response.ok)throw Error('Could not move card');
    location.reload();
  }catch(error){alert(error.message)}
});
document.addEventListener('keydown',event=>{if(event.key.toLowerCase()==='c'&&!event.altKey&&!event.ctrlKey&&!event.metaKey&&!/input|textarea/i.test(document.activeElement?.tagName||''))document.getElementById('add-card')?.requestSubmit()});
</script>
</body></html>
