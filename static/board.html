<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{BOARD_NAME}} | Rizzy</title>
<style>
:root { font: 16px/1.5 system-ui,sans-serif; color: #f5f0e8; background: #1b1b1b }
* { box-sizing: border-box }
body { margin: 0 }
a { color: inherit }
button { font: inherit; cursor: pointer }
.skip { position: absolute; left: -9999px }
.skip:focus { left: 16px; top: 12px; z-index: 10 }
.site { min-height: 70px; display: flex; align-items: center; gap: 24px; padding: 0 max(20px,4vw); border-bottom: 1px solid #383735 }
.site__brand { font-size: 29px; font-weight: 800; letter-spacing: -.055em; text-decoration: none }
.site__back { color: #d6c9b5; font-weight: 650; text-decoration: none }
.board { padding: 22px max(20px,4vw) 60px }
.board__header { display: flex; align-items: center; justify-content: space-between; gap: 16px }
.board__actions { display:flex;align-items:center;gap:10px }
h1 { margin: 0; font-size: clamp(28px,4vw,42px); letter-spacing: -.045em }
.button { border: 1px solid #d5a94c; background: #e7bd61; color: #201b12; border-radius: 9px; padding: 9px 15px; font-weight: 700 }
.button:hover { background: #f0ca77 }
.button--secondary { border-color: #666158; background: #393733; color: #f6f0e8 }
.button--secondary:hover { background: #4a463f }
.board__actions a { text-decoration:none }
.card-columns { display: flex; align-items: flex-start; gap: 16px; overflow-x: auto; padding: 24px 0 40px }
.cards { flex: 0 0 290px; min-height: 200px; background: #292826; border: 1px solid #46433d; border-radius: 16px; padding: 14px }
.cards--drop-target { border-color: #e7bd61; box-shadow: inset 0 0 0 2px #e7bd61 }
.cards__header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 15px }
.cards__header h2 { margin: 0; font-size: 18px; line-height: 1.2 }
.cards__count { color: #afa89d; font-size: 13px }
.cards__list { display: grid; gap: 10px }
.card { display: block; position: relative; min-height: 100px; padding: 14px; border: 1px solid #57534d; border-radius: 12px; background: #34322f; text-decoration: none }
.card:hover,.card:focus-visible { border-color: #e7bd61; outline: none }
.card--golden { border-color: #b58b39 }
.card__number { color: #cbbf9e; font-size: 12px }
.card__title { display: block; margin-top: 8px; font-size: 17px; font-weight: 750; line-height: 1.3; overflow-wrap: anywhere }
.card__meta { display: block; margin-top: 14px; color: #afa89d; font-size: 12px }
.cards__empty { margin: 5px 0; color: #afa89d; font-size: 14px }
.cards__more { display: block; margin-top: 15px; color: #e7bd61; font-size: 14px }
.board-tools { display: grid; gap: 8px; margin-top: 16px }
.board-tools form { margin: 0 }
.board-tools button { width: 100% }
.board-filter { display: flex; align-items: end; flex-wrap: wrap; gap: 12px; margin-top: 18px }
.board-filter label { display: grid; gap: 4px; font-size: 13px; color: #d6c9b5 }
.board-filter input,.board-filter select { min-height: 41px; padding: 8px 10px; border: 1px solid #666158; border-radius: 8px; background: #34322f; color: #f5f0e8; font: inherit }
.board-filter a { padding: 8px; color: #e7bd61 }
.card-columns--filtered .cards { flex: 1 1 auto }
.cards--grid .cards__list { grid-template-columns: repeat(auto-fill,minmax(220px,1fr)) }
.cards--grid .button { display: inline-block; margin: 16px 12px 0 0; text-decoration: none }
@media (max-width:600px) { .site__back { display:none } .board { padding: 18px 16px } .board__header { align-items: flex-start } .cards { flex-basis: min(290px,82vw) } }
</style>

<body data-account="{{ACCOUNT}}" data-board="{{BOARD_ID}}">
<a class="skip" href="#main">Skip to main content</a>
<header class="site"><details class="site-menu"><summary><span class="site-logo" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>Rizzy<span class="site-caret">⌄</span></summary><nav><a href="/{{ACCOUNT}}/my/menu">Explore</a><a href="{{HOME_PATH}}">All boards</a><a href="/{{ACCOUNT}}/cards">All cards</a></nav></details></header>
<main class="board" id="main">
  <div class="board__header"><h1>{{BOARD_NAME}}</h1><div class="board__actions">{{WEBHOOKS_LINK}}{{SETTINGS_LINK}}</div></div>
  {{FILTER_FORM}}
  <div class="board-stage">{{COLUMNS}}{{ADD_COLUMN}}</div>
</main>
<footer class="bottom-bar"><button type="button" data-utility="pins">Pinned</button><button type="button" data-utility="search">Search</button><button type="button" data-utility="notifications">Notifications</button></footer>
<dialog class="utility-panel" id="utility-panel"><button type="button" class="utility-close" aria-label="Close">×</button><h2 id="utility-title"></h2><input type="search" class="utility-search" id="utility-search" placeholder="Search all cards" aria-label="Search all cards" hidden><div class="utility-content" id="utility-content"></div></dialog>
<script>
function relativeDates(){const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());for(const time of document.querySelectorAll('time[data-relative-date]')){const date=new Date(time.dateTime);if(Number.isNaN(date.getTime()))continue;const day=new Date(date.getFullYear(),date.getMonth(),date.getDate());const days=Math.round((today-day)/86400000);time.textContent=days===0?'today':days===1?'yesterday':days>1&&days<7?`${days} days ago`:date.toLocaleDateString(undefined,{month:'short',day:'numeric'});time.removeAttribute('data-relative-date')}}
relativeDates();
document.querySelectorAll('.cards__toggle').forEach(toggle=>toggle.addEventListener('click',()=>{const column=toggle.closest('.cards');if(column.classList.contains('is-expanded'))return;document.querySelectorAll('.card-columns>.cards').forEach(item=>{const expanded=item===column;item.classList.toggle('is-expanded',expanded);item.classList.toggle('is-collapsed',!expanded);item.querySelector('.cards__toggle')?.setAttribute('aria-expanded',String(expanded))});column.querySelector('.cards__more[data-page="1"]')?.click()}));
document.querySelector('.board-tools__watch-toggle')?.addEventListener('click',async event=>{const button=event.currentTarget;button.disabled=true;try{const response=await fetch(`/${document.body.dataset.account}/boards/${document.body.dataset.board}/involvement`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({involvement:button.dataset.involvement})});if(!response.ok)throw Error('Could not update watching');location.reload()}catch(error){button.disabled=false;alert(error.message)}});
const utility=document.getElementById('utility-panel'),utilityTitle=document.getElementById('utility-title'),utilitySearch=document.getElementById('utility-search'),utilityContent=document.getElementById('utility-content');
function utilityList(items,empty){utilityContent.replaceChildren();if(!items.length){const message=document.createElement('p');message.textContent=empty;utilityContent.append(message);return}for(const item of items){const link=document.createElement('a');link.href=item.url;link.textContent=item.title;utilityContent.append(link)}}
async function loadUtility(kind,term=''){utilityContent.textContent='Loading…';try{const account=document.body.dataset.account,url=kind==='pins'?`/${account}/my/pins`:kind==='notifications'?`/${account}/notifications/tray`:`/${account}/search?q=${encodeURIComponent(term)}`;const response=await fetch(url,{headers:{Accept:'application/json'}});if(!response.ok)throw Error('Could not load');const data=await response.json(),rows=Array.isArray(data)?data:[];utilityList(rows.map(item=>kind==='notifications'?{url:item.card?.url||'#',title:item.card?.title||'Notification'}:{url:item.url,title:item.title}),kind==='pins'?'No pinned cards yet':kind==='notifications'?'No notifications':'No matching cards')}catch{utilityContent.textContent='Could not load items.'}}
document.querySelectorAll('[data-utility]').forEach(button=>button.addEventListener('click',()=>{const kind=button.dataset.utility;utilityTitle.textContent=kind==='pins'?'Pinned cards':kind==='notifications'?'Notifications':'Search cards';utilitySearch.hidden=kind!=='search';utilityContent.replaceChildren();utility.showModal();if(kind==='search'){utilitySearch.value='';utilitySearch.focus()}else loadUtility(kind)}));
utility.querySelector('.utility-close').addEventListener('click',()=>utility.close());utility.addEventListener('click',event=>{if(event.target===utility)utility.close()});let utilitySearchTimer;utilitySearch.addEventListener('input',()=>{clearTimeout(utilitySearchTimer);if(utilitySearch.value.trim())utilitySearchTimer=setTimeout(()=>loadUtility('search',utilitySearch.value.trim()),300);else utilityContent.replaceChildren()});
const filterForm=document.querySelector('.board-filter');let filterTimer;filterForm?.querySelector('input[type=search]')?.addEventListener('input',()=>{clearTimeout(filterTimer);filterTimer=setTimeout(()=>filterForm.requestSubmit(),400)});filterForm?.addEventListener('change',event=>{if(event.target.matches('select'))filterForm.requestSubmit()});
document.getElementById('add-column')?.addEventListener('click',async()=>{
  const name=prompt('Column name'); if(!name?.trim())return;
  const account=document.body.dataset.account,board=document.body.dataset.board;
  const response=await fetch(`/${account}/boards/${board}/columns`,{method:'POST',headers:{Accept:'application/json','Content-Type':'application/json'},body:JSON.stringify({column:{name:name.trim()}})});
  if(response.ok)location.reload();else alert('Could not add column');
});
document.querySelectorAll('.cards__more').forEach(button=>button.addEventListener('click',async()=>{
  button.disabled=true;
  const page=Number(button.dataset.page);
  try {
    const response=await fetch(`${button.dataset.path}?page=${page}`,{headers:{Accept:'text/html','X-Rizzy-Card-Fragment':'1'}});
    if(!response.ok)throw Error('Could not load cards');
    const markup=await response.text(),column=button.closest('.cards'),list=column.querySelector('.cards__list');
    list.querySelector('[data-loading]')?.remove();
    const fragment=document.createRange().createContextualFragment(markup),loaded=fragment.querySelectorAll('article.card').length;
    list.append(fragment);relativeDates();
    if(list.querySelectorAll('.card').length>=Number(column.dataset.count)||loaded<[15,30,50,100][Math.min(page-1,3)])button.remove();else{button.dataset.page=String(page+1);button.textContent='Load more';button.disabled=false}
  }catch(error){button.disabled=false;alert(error.message)}
}));
const lazyColumns=new IntersectionObserver(entries=>{for(const entry of entries)if(entry.isIntersecting){lazyColumns.unobserve(entry.target);entry.target.click()}});
document.querySelectorAll('.cards__more[data-page="1"]').forEach(button=>lazyColumns.observe(button));
const boardColumns=document.querySelector('.card-columns');let draggedCard=null;
boardColumns?.addEventListener('dragstart',event=>{
  const card=event.target.closest('.card[data-card-number]');if(!card)return;
  draggedCard=card.dataset.cardNumber;event.dataTransfer.effectAllowed='move';event.dataTransfer.setData('text/plain',draggedCard);
});
boardColumns?.addEventListener('dragover',event=>{
  if(!draggedCard)return;
  const column=event.target.closest('.cards[data-column-id]');if(!column)return;
  event.preventDefault();event.dataTransfer.dropEffect='move';
  boardColumns.querySelectorAll('.cards--drop-target').forEach(item=>item.classList.remove('cards--drop-target'));
  column.classList.add('cards--drop-target');
});
boardColumns?.addEventListener('dragend',()=>{draggedCard=null;boardColumns.querySelectorAll('.cards--drop-target').forEach(item=>item.classList.remove('cards--drop-target'))});
boardColumns?.addEventListener('drop',async event=>{
  if(!draggedCard)return;
  const column=event.target.closest('.cards[data-column-id]');if(!column)return;
  event.preventDefault();
  const account=document.body.dataset.account,id=column.dataset.columnId,card=draggedCard;
  const destination=id==='done'?'closure':id==='not-now'?'not_now':id==='maybe'?'stream':'column';
  const suffix=destination==='column'?`?column_id=${encodeURIComponent(id)}`:'';
  draggedCard=null;column.classList.remove('cards--drop-target');
  try {
    const response=await fetch(`/${account}/columns/cards/${card}/drops/${destination}${suffix}`,{method:'POST',headers:{Accept:'text/vnd.turbo-stream.html'}});
    if(!response.ok)throw Error('Could not move card');
    location.reload();
  }catch(error){alert(error.message)}
});
document.addEventListener('keydown',event=>{if(event.key.toLowerCase()==='c'&&!event.altKey&&!event.ctrlKey&&!event.metaKey&&!/input|textarea/i.test(document.activeElement?.tagName||''))document.getElementById('add-card')?.requestSubmit()});
</script>
</body></html>
