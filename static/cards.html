<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}} | Rizzy</title>
<style>
:root{font:16px/1.5 system-ui,sans-serif;color:#f5f0e8;background:#1b1b1b}*{box-sizing:border-box}body{margin:0}a{color:inherit}.skip{position:absolute;left:-9999px}.skip:focus{left:16px;top:12px;z-index:10}header.site{min-height:70px;display:flex;align-items:center;gap:24px;padding:0 max(20px,4vw);border-bottom:1px solid #383735}header.site a{text-decoration:none}header.site .brand{font-size:29px;font-weight:800;letter-spacing:-.055em}header.site .link{color:#d6c9b5;font-weight:650}main{padding:22px max(20px,4vw) 70px}h1{margin:0;font-size:clamp(28px,4vw,42px);letter-spacing:-.045em}.intro{color:#afa89d;margin:0 0 20px}.filter-form{display:flex;align-items:end;gap:12px;flex-wrap:wrap;padding:18px 0 22px;border-bottom:1px solid #383735}.filter-form label{display:grid;gap:4px;color:#d6c9b5;font-size:13px;font-weight:600}.filter-form input,.filter-form select{min-height:42px;border:1px solid #666158;border-radius:8px;background:#34322f;color:#f5f0e8;font:inherit;font-size:14px;padding:8px 10px}.filter-form input[type=search]{min-width:240px}.filter-form select{min-width:135px}.filter-form button{min-height:42px;border:1px solid #d5a94c;border-radius:8px;background:#e7bd61;color:#201b12;font:inherit;font-weight:700;padding:8px 14px;cursor:pointer}.clear-link,.page-link,.cards__more{color:#e7bd61;font-size:14px;font-weight:650}.clear-link{padding:9px 0}.more-filters{position:relative;align-self:end}.more-filters summary{min-height:42px;display:flex;align-items:center;padding:8px 12px;border:1px solid #666158;border-radius:8px;cursor:pointer;color:#f5f0e8}.more-filters[open] .more-filters__fields{position:absolute;z-index:3;top:48px;right:0;width:min(480px,calc(100vw - 32px));display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:16px;border:1px solid #666158;border-radius:12px;background:#292826;box-shadow:0 16px 35px #0008}.more-filters__fields select,.more-filters__fields input{width:100%}.cards{padding-top:24px}.cards__list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.card{min-height:150px;background:#292826;border:1px solid #46433d;border-radius:14px;overflow:hidden}.card:hover,.card:focus-within{border-color:#e7bd61}.card--golden{border-color:#b58b39}.card__link{display:flex;flex-direction:column;height:100%;padding:16px;text-decoration:none}.card__board{font-size:12px;color:#e7bd61;font-weight:650}.card__number{font-size:12px;color:#cbbf9e;margin-top:5px}.card__title{font-size:18px;line-height:1.3;margin:12px 0;overflow-wrap:anywhere}.card__status{margin-top:auto;color:#afa89d;font-size:12px}.cards__more{grid-column:1/-1;display:block;width:max-content;padding:8px 0}.blank-slate{grid-column:1/-1;padding:28px;color:#afa89d;border:1px dashed #57534d;border-radius:14px}.page-link{display:inline-block;margin-top:18px}@media(max-width:650px){header.site .link{display:none}main{padding:18px 16px 50px}.filter-form>*{flex:1 1 140px}.filter-form input[type=search]{min-width:0;width:100%}.filter-form .clear-link{flex:0 0 auto}.more-filters[open] .more-filters__fields{left:0;right:auto}.cards__list{grid-template-columns:1fr}}
</style>
<style>.choice-popover{position:relative;align-self:end}.choice-popover>summary{min-height:42px;display:flex;align-items:center;min-width:135px;padding:8px 12px;border:1px solid #666158;border-radius:8px;cursor:pointer;color:#f5f0e8;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}.choice-popover__items{position:absolute;z-index:5;top:48px;left:0;min-width:220px;max-width:min(360px,calc(100vw - 32px));max-height:280px;overflow:auto;display:grid;gap:2px;padding:8px;border:1px solid #666158;border-radius:10px;background:#292826;box-shadow:0 16px 35px #0008}.choice-popover:not([open]) .choice-popover__items{display:none}.choice-popover__item{display:flex!important;align-items:center;gap:8px;padding:8px;border-radius:6px;color:#f5f0e8!important;font-size:14px!important;cursor:pointer}.choice-popover__item:hover{background:#3d3a35}.choice-popover__item input{min-height:0;margin:0;accent-color:#e7bd61}</style>
<style>
.for-screen-reader{position:absolute;inline-size:1px;block-size:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.cards__list{grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch}
.card{--card-color:#79a9ed;position:relative;min-height:210px;display:flex;flex-direction:column;background:color-mix(in srgb,var(--card-color) 9%,#292826);box-shadow:0 2px 8px #0003}
.card--color-1{--card-color:#9da2a9}.card--color-2{--card-color:#a99584}.card--color-3{--card-color:#d9b569}.card--color-4{--card-color:#a7bf5e}.card--color-5{--card-color:#69b8c3}.card--color-6{--card-color:#a590dd}.card--color-7{--card-color:#bf8fce}.card--color-8{--card-color:#d393b8}
.card__main{display:flex;flex:1;flex-direction:column;min-width:0}
.card__link{position:absolute;inset:0;z-index:1;padding:0}
.card__header{display:flex;align-items:flex-start;min-width:0}
.card__board{display:flex;align-items:center;max-width:100%;min-width:0;padding:7px 12px;border-radius:0 0 8px 0;background:var(--card-color);color:#201b12;font-size:12px;font-weight:800;line-height:1.2;text-transform:uppercase}
.card__id{flex-shrink:0}.card__board-name{min-width:0;margin-left:8px;padding-left:8px;border-left:1px solid #201b125c}.overflow-ellipsis{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card__column-name{align-self:center;margin-left:auto;margin-right:12px;border:1px solid var(--card-color);border-radius:5px;padding:3px 7px;color:var(--card-color);font-size:10px;font-weight:750;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card__body{position:relative;display:flex;flex:1;align-items:flex-start;padding:12px 18px 14px;min-width:0}
.card__content{width:100%;min-width:0}.card__title{margin:0;font-size:clamp(23px,2.4vw,36px);font-weight:900;line-height:1.12;letter-spacing:-.035em;overflow-wrap:anywhere}
.overflow-line-clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.card__footer{min-height:43px;padding:8px 18px 11px;border-top:1px solid #ffffff19;color:#afa89d;font-size:11px}
.card__meta{display:flex;gap:9px;flex-wrap:wrap}.card__meta-text--updated{margin-left:auto}
.card__closed{position:absolute;right:10px;bottom:0;transform:rotate(7deg);border:3px solid #92b79b;border-radius:4px;background:#2b302cdd;padding:4px 10px;color:#a6d1af;font-size:17px;font-weight:900;text-transform:uppercase;pointer-events:none}
.card--golden{background:#3b3524}.card--golden .card__board{background:#f0ca76}
@media(max-width:960px){.cards__list{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:650px){.cards__list{grid-template-columns:1fr}.card{min-height:190px}.card__title{font-size:30px}}
</style>
</head>
<body data-account="{{ACCOUNT}}">
<a class="skip" href="#main">Skip to main content</a>
<header class="site"><a class="brand" href="/{{ACCOUNT}}">Rizzy</a><a class="link" href="/{{ACCOUNT}}/boards">All boards</a><a class="link" href="/{{ACCOUNT}}/cards">All cards</a></header>
<main id="main"><h1>{{TITLE}}</h1><p class="intro">{{COUNT}} cards</p>
{{FILTER_FORM}}
<turbo-frame id="cards_container"><section class="cards cards--grid"><div class="cards__list" id="cards_paginated_container">{{CARDS}}</div></section></turbo-frame>
{{PREVIOUS}}
</main>
<script>
const list=document.getElementById('cards_paginated_container');
const observer=new IntersectionObserver(entries=>{for(const entry of entries)if(entry.isIntersecting){observer.unobserve(entry.target);loadMore(entry.target)}},{rootMargin:'300px'});
async function loadMore(link){if(link.dataset.loading)return;link.dataset.loading='1';try{const response=await fetch(link.dataset.previewUrl,{headers:{Accept:'text/vnd.turbo-stream.html'}});if(!response.ok)throw Error('Could not load cards');const documentFragment=new DOMParser().parseFromString(await response.text(),'text/html');const appended=documentFragment.querySelector('turbo-stream[action="append"] template');if(!appended)throw Error('Invalid card page');const content=appended.content.cloneNode(true);link.remove();list.append(content);observeNext()}catch(error){link.removeAttribute('data-loading');link.textContent='Load more cards';console.error(error)}}
function observeNext(){const link=list.querySelector('.cards__more[data-preview-url]');if(link)observer.observe(link)}
list.addEventListener('click',event=>{const link=event.target.closest('.cards__more[data-preview-url]');if(link){event.preventDefault();observer.unobserve(link);loadMore(link)}});
observeNext();
</script>
</body></html>
