<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>{{TITLE}} | Rizzy</title>
<style>
:root{font:19px/1.375 "Segoe UI",system-ui,sans-serif;color:#f4f5f6;background:#101b20}
*{box-sizing:border-box}body{margin:0;min-height:100vh}a{color:inherit}button,input,select{font:inherit}
.for-screen-reader{position:absolute;inline-size:1px;block-size:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.skip{position:absolute;left:-9999px}.skip:focus{left:12px;top:12px;z-index:20;background:#fff;color:#111;padding:7px}
.site{height:52px;display:flex;justify-content:center;align-items:center}
.site-menu-trigger{display:flex;align-items:center;gap:8px;text-decoration:none;cursor:pointer;font-weight:800;font-size:22px}
.site-logo{display:flex;gap:2px;align-items:center;justify-content:center;width:29px;height:29px;border:1px solid #40505a;border-radius:7px;background:#182730}.site-logo i{display:block;height:18px;width:3px;border-radius:2px;background:#e65667}.site-logo i:nth-child(2){background:#eab548}.site-logo i:nth-child(3){background:#75bf74}.site-logo i:nth-child(4){background:#56a7d8}.site-logo i:nth-child(5){background:#a67bd7}
.site-caret{font-size:13px;font-weight:400;margin-left:7px}
main{max-width:1400px;margin:auto;padding:0 clamp(18px,3vw,38px) 90px}
.title-row{position:relative;display:flex;align-items:center;gap:16px}.title-row h1{flex:1;display:flex;align-items:center;gap:20px;text-align:center;margin:0;font-size:28.5px;line-height:1.38;font-weight:900;white-space:nowrap}.title-row h1:before,.title-row h1:after{content:"";height:1px;flex:1;background:#3d4b52}.settings-link{position:absolute;right:0;top:50%;transform:translateY(-50%);display:grid;place-items:center;border:1px solid #5b6a71;border-radius:50%;width:38px;height:38px;font-size:22px;text-decoration:none;background:#101b20}
.filter-form{display:flex;justify-content:center;align-items:center;gap:6px;min-height:57px;margin:0 0 12px;padding:7px 0 10px}.filter-form label{font-size:12px}.filter-form input,.filter-form select{background:#1c2b34;border:1px solid #5d6c73;border-radius:18px;color:#f4f5f6;padding:7px 12px;font-size:14px;min-height:36px}.filter-search input{width:228px;background:transparent}.filter-form input::placeholder{color:#87939a}.filter-form button{background:#384f62;color:#fff;border:1px solid #748390;border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer}.filter-form select{width:100%;border-radius:8px}
.quick-filters{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:6px}.filter-form:not(.is-expanded) .quick-filter:not(.is-selected){display:none}.quick-filter{position:relative}.filter-form .quick-filter__toggle{max-width:min(220px,calc(100vw - 32px));height:36px;padding:6px 28px 6px 12px;border:1px solid #5d6c73;border-radius:18px;background:#17262e;color:#f4f5f6;font:inherit;font-size:14px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.quick-filter__toggle:after{content:"";position:absolute;right:12px;top:13px;width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg)}.quick-filter.is-selected .quick-filter__toggle{background:#304d64;border-color:#80a8cb}.quick-filter__toggle:focus-visible{outline:2px solid #8eb9f2;outline-offset:2px}.quick-filter__popup{position:fixed;z-index:30;display:grid;gap:5px;width:min(280px,calc(100vw - 24px));max-height:min(60vh,420px);overflow:auto;padding:10px;border:1px solid #63747d;border-radius:10px;background:#1d2c35;box-shadow:0 12px 30px #000a}.quick-filter__popup[hidden]{display:none}.filter-form .quick-filter__choice{display:flex;align-items:center;gap:8px;margin:0;padding:7px 8px;border-radius:5px;color:#f4f5f6;font-size:14px;cursor:pointer}.quick-filter__choice:hover,.quick-filter__choice:focus-within{background:#354c58}.filter-form .quick-filter__choice input{width:16px;height:16px;min-height:0;margin:0;padding:0;accent-color:#8eb9f2}.filter-form .more-filters__toggle{flex:none;width:36px;height:36px;padding:0;border:1px solid #5d6c73;border-radius:50%;background:transparent;color:#f4f5f6;font-size:19px;cursor:pointer}.filter-form.is-expanded .more-filters__toggle{background:#8eb9f2;color:#0e1a22}.more-filters__toggle:focus-visible{outline:2px solid #8eb9f2;outline-offset:2px}.clear-link{display:grid;place-items:center;width:37px;height:37px;border:1px solid #66737a;border-radius:50%;font-size:29px;font-weight:200;text-decoration:none;line-height:1}.clear-link:hover{background:#243540}
.cards{margin:4px auto 0;max-width:1400px}.cards__list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch;gap:19px;padding:12px}.card{--card-color:oklch(74% .1293 256);--card-bg:color-mix(in srgb,var(--card-color) 4%,#101b20);--card-text:color-mix(in srgb,var(--card-color) 30%,#f4f5f6);position:relative;display:flex;flex-direction:column;min-height:107px;padding:11px;background:var(--card-bg);border:1px solid #35434b;border-radius:2px;font-size:11.4px;line-height:1.375;box-shadow:0 0 0 1px #0b1418}.card:hover,.card:focus-within{outline:1px solid var(--card-color)}
.card--color-1{--card-color:oklch(62% .0122 260)}.card--color-2{--card-color:oklch(62% .0552 70)}.card--color-3{--card-color:oklch(62.1% .146 70)}.card--color-4{--card-color:oklch(62% .128 112)}.card--color-5{--card-color:oklch(62% .106 208)}.card--color-6{--card-color:oklch(62% .184 286)}.card--color-7{--card-color:oklch(62% .177 308)}.card--color-8{--card-color:oklch(62% .166 342)}
.card__main{display:flex;flex:1;flex-direction:column;min-width:0}.card__link{position:absolute;inset:0;z-index:1}.card__header{display:flex;align-items:center;gap:5px;min-width:0;margin:-11px -11px 0;height:24px;white-space:nowrap}.card__board{display:flex;align-items:center;flex:0 1 auto;max-width:100%;min-width:0;background:var(--card-color);color:#0d1418;font-weight:700;line-height:15px;padding:4px 8px 4px 11px;border-radius:2px 0 2px 0;text-transform:uppercase}.card__id{flex:none}.card__board-name{min-width:0;border-left:1px solid #0d14185c;margin-left:7px;padding-left:7px}.overflow-ellipsis{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card__tags{display:flex;gap:5px;flex:0 1 auto;min-width:0;overflow:hidden;color:var(--card-color);font-weight:750;text-transform:uppercase}.card__tag{overflow:hidden;text-overflow:ellipsis}.card__steps{flex:none;color:var(--card-color);font-weight:800}.card__column-name{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;border:1px solid var(--card-color);border-radius:4px;padding:2px 6px;color:var(--card-color);font-weight:700;text-transform:uppercase}
.card__body{display:flex;flex:1;min-width:0;padding:6px 0 5px}.card__content{min-width:0;width:100%}.card__title{margin:0;color:var(--card-text);font-size:18.24px;font-weight:900;line-height:1.15;letter-spacing:-.02em}.overflow-line-clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.card__footer{display:flex;align-items:end;gap:6px;min-height:31px;color:var(--card-color);font-weight:650}.card__meta{display:grid;grid-template-columns:30px auto auto;grid-template-rows:16px 16px;column-gap:6px;align-items:center;min-width:0}.card__avatar{grid-column:1;grid-row:1/3;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#837329;color:white;font-size:11px}.card__meta-text{white-space:nowrap;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis}.card__meta-text--added{grid-column:2;grid-row:1}.card__meta-text--updated{grid-column:3;grid-row:1}.card__meta-text--author{grid-column:2/4;grid-row:2}.card__meta-text--assignees{grid-column:2/4;grid-row:3}.card__counts{display:flex;gap:8px;margin-left:auto;white-space:nowrap}.card__boosts,.card__comments{font-size:11px}.card__closed{position:absolute;right:7px;bottom:4px;transform:rotate(5deg);border:2px solid #71a978;background:#1c2c27df;border-radius:3px;padding:2px 7px;color:#a4d1a6;font-size:14px;font-weight:900;text-transform:uppercase}.card:has(.card__closed){--card-color:#9ca5a9}.card--golden{box-shadow:0 0 0 1px #d8bf6a,0 0 10px #d8bf6a55}
.blank-slate{grid-column:1/-1;text-align:center;color:#98a5ab;padding:20px}.cards__more,.page-link{grid-column:1/-1;color:#aacaff;font-size:14px}.page-link{display:block;width:max-content;margin:12px auto}
@media(max-width:959px){.cards__list{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:639px){:root{font-size:16px}.title-row h1{font-size:23px;gap:7px}.cards__list{grid-template-columns:1fr;padding:8px}.filter-form{flex-wrap:wrap}.filter-search input{width:min(60vw,230px)}.quick-filters{flex-basis:100%}.settings-link{width:29px;height:29px;font-size:17px}}
.card{isolation:isolate;overflow:hidden}.card__header,.card__body,.card__meta,.card__counts{position:relative;z-index:1}.card__link{z-index:2}.card__background{position:absolute;inset:0;z-index:0;pointer-events:none}.card__background img{width:100%;height:100%;object-fit:cover;opacity:.6}.card__avatar,.card__assignee-avatar{object-fit:cover;border-radius:50%;flex:none}.card__meta{grid-template-columns:30px auto minmax(0,1fr) auto}.card__meta-text--updated{grid-column:3;grid-row:1}.card__meta-text--assignees{grid-column:2/4;grid-row:3}.card__assignee-avatars{grid-column:4;grid-row:1/3;display:flex;align-items:center;padding-left:8px}.card__assignee-avatar{width:24px;height:24px;margin-left:-8px;border:1px solid var(--card-bg)}
</style>
<style>{{SHELL_STYLES}}</style>
</head>
<body data-account="{{ACCOUNT}}">
<a class="skip" href="#main">Skip to main content</a>
<header class="site"><a class="site-menu-trigger" href="/{{ACCOUNT}}/my/menu" data-open-menu aria-haspopup="dialog" aria-expanded="false"><span class="site-logo" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>Rizzy<span class="site-caret">⌄</span></a></header><dialog id="menu-dialog" aria-label="Rizzy menu"><turbo-frame id="my_menu"></turbo-frame></dialog>
<main id="main"><div class="title-row"><h1>{{TITLE}}</h1>{{SETTINGS_LINK}}</div><p class="for-screen-reader">{{COUNT}} cards</p>
{{FILTER_FORM}}
<turbo-frame id="cards_container"><section class="cards cards--grid"><div class="cards__list" id="cards_paginated_container">{{CARDS}}</div></section></turbo-frame>
{{PREVIOUS}}
</main>
{{SHELL_FOOTER}}
<script>
document.addEventListener('click',event=>{const link=event.target.closest('a[href]');if(!link)return;const destination=new URL(link.href);if(destination.origin!==location.origin||!new RegExp(`^/${document.body.dataset.account}/cards/\\d+$`).test(destination.pathname))return;sessionStorage.setItem('rizzy-card-referrer',JSON.stringify({url:location.href,label:document.title.replace(/ \| Rizzy$/,'')}))});
const list=document.getElementById('cards_paginated_container');
const observer=new IntersectionObserver(entries=>{for(const entry of entries)if(entry.isIntersecting){observer.unobserve(entry.target);loadMore(entry.target)}},{rootMargin:'300px'});
function relativeDates(){const today=new Date();const midnight=new Date(today.getFullYear(),today.getMonth(),today.getDate());for(const time of document.querySelectorAll('time[data-relative-date]')){const date=new Date(time.dateTime);if(Number.isNaN(date.getTime()))continue;const day=new Date(date.getFullYear(),date.getMonth(),date.getDate());const days=Math.round((midnight-day)/86400000);time.textContent=days===0?'today':days===1?'yesterday':days>1&&days<7?`${days} days ago`:date.toLocaleDateString(undefined,{month:'short',day:'numeric'});time.removeAttribute('data-relative-date')}}
async function loadMore(link){if(link.dataset.loading)return;link.dataset.loading='1';try{const response=await fetch(link.dataset.previewUrl,{headers:{Accept:'text/vnd.turbo-stream.html'}});if(!response.ok)throw Error('Could not load cards');const documentFragment=new DOMParser().parseFromString(await response.text(),'text/html');const appended=documentFragment.querySelector('turbo-stream[action="append"] template');if(!appended)throw Error('Invalid card page');const content=appended.content.cloneNode(true);link.remove();list.append(content);relativeDates();observeNext()}catch(error){link.removeAttribute('data-loading');link.textContent='Load more cards';console.error(error)}}
function observeNext(){const link=list.querySelector('.cards__more[data-preview-url]');if(link)observer.observe(link)}
list.addEventListener('click',event=>{const link=event.target.closest('.cards__more[data-preview-url]');if(link){event.preventDefault();observer.unobserve(link);loadMore(link)}});
const form=document.querySelector('.filter-form');let searchTimer;form.addEventListener('change',event=>{const field=event.target;if(field.matches('input[name="assignment_status"]')&&field.checked)form.querySelectorAll('input[name="assignee_ids[]"]').forEach(input=>input.checked=false);else if(field.matches('input[name="assignee_ids[]"]')&&field.checked)form.querySelector('input[name="assignment_status"]').checked=false;if(field.matches('input:not([type=search]),select'))form.requestSubmit()});form.querySelector('input[type=search]').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>form.requestSubmit(),400)});
const filterToggle=form.querySelector('.more-filters__toggle');
function closeQuickFilters(except=null){form.querySelectorAll('.quick-filter').forEach(filter=>{if(filter===except)return;filter.querySelector('.quick-filter__popup').hidden=true;filter.querySelector('.quick-filter__toggle').setAttribute('aria-expanded','false')})}
function setFilterOpen(open){form.classList.toggle('is-expanded',open);form.querySelector('input[name="expand_all"]').disabled=!open;filterToggle.setAttribute('aria-expanded',String(open));const label=open?'Collapse filter options':'Expand filter options';filterToggle.setAttribute('aria-label',label);filterToggle.title=label;if(!open)closeQuickFilters()}
filterToggle.addEventListener('click',()=>setFilterOpen(!form.classList.contains('is-expanded')));
form.addEventListener('click',event=>{const toggle=event.target.closest('.quick-filter__toggle');if(!toggle)return;const filter=toggle.closest('.quick-filter'),popup=filter.querySelector('.quick-filter__popup'),open=popup.hidden;closeQuickFilters(filter);popup.hidden=!open;toggle.setAttribute('aria-expanded',String(open));if(open){const box=toggle.getBoundingClientRect();popup.style.left=`${Math.max(12,Math.min(box.left,innerWidth-popup.offsetWidth-12))}px`;popup.style.top=`${Math.min(box.bottom+6,innerHeight-popup.offsetHeight-12)}px`}});
form.addEventListener('keydown',event=>{if(event.key==='Escape'){const open=form.querySelector('.quick-filter__toggle[aria-expanded=true]');if(open){closeQuickFilters();open.focus()}else if(form.classList.contains('is-expanded')){setFilterOpen(false);filterToggle.focus()}}});
document.addEventListener('click',event=>{if(!event.target.closest('.quick-filter'))closeQuickFilters()});
addEventListener('resize',()=>closeQuickFilters());
relativeDates();observeNext();
</script>
<script>{{SHELL_SCRIPT}}</script>
</body></html>
