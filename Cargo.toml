[package]
name = "rizzy"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-OSaasy"

[dependencies]
axum = { version = "0.8", features = ["json", "multipart"] }
ammonia = "4"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
crc32fast = "1"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
kuchiki = "0.8"
hex = "0.4"
md-5 = "0.10"
percent-encoding = "2"
qrcodegen = "1.8"
rand = "0.9"
regex = "1"
rust-stemmers = "1.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rustls = { version = "0.23", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "mysql", "any", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
uuid = { version = "1", features = ["v4", "v7"] }
url = "2"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
webauthn-rs = { version = "0.5.5", default-features = false, features = ["conditional-ui", "danger-allow-state-serialisation"] }
web-push = { version = "0.11.0", default-features = false }

[patch.crates-io]
sqlx-mysql = { path = "vendor/sqlx-mysql" }
